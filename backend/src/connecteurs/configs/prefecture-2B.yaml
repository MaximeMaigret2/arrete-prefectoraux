# backend/src/connecteurs/configs/prefecture-2B.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture de la
# Haute-Corse. Sélecteurs établis le 2026-08-14 contre une capture réelle
# du site (fetch direct depuis le sandbox cloud).
#
# Structure réelle (cf. fixtures/connecteurs/reel/prefecture-2B/SOURCE.md
# pour le détail complet) :
# - `url_liste` (racine, `point_acces` de registre-sources.yaml) liste
#   DIRECTEMENT une carte DSFR (`.fr-card__title a`) par ANNÉE (href se
#   terminant par "-{annee}", ex. ".../Recueil-des-actes-administratifs-2026"
#   pour l'année courante, ".../Recueils-des-actes-administratifs-2025" pour
#   les années précédentes — préfixe singulier/pluriel incohérent selon
#   l'année, sans incidence car le motif n'ancre que la fin de l'URL) — pas
#   de désambiguïsation nécessaire (racine dédiée à ce seul département,
#   contrairement à prefecture-2A). Deux cartes supplémentaires couvrent des
#   plages pluriannuelles ("2016-a-2022", "2005-a-2015") qui ne matchent
#   jamais "-{annee}$" pour l'année courante.
# - La page de l'année liste à son tour une carte DSFR par MOIS (même
#   sélecteur), href se terminant par "-mois-de-{mois_fr_minuscule}-{annee}"
#   la plupart des mois, mais "-mois-d-{mois_fr_minuscule}-{annee}" (élision)
#   pour les mois commençant par une voyelle (avril, août observés) — d'où
#   l'alternative `(de-|d-)` dans le motif plutôt qu'un connecteur fixe.
# - La page du mois contient à la fois une liste narrative (titre + résumé
#   article par article, hors périmètre) ET, en pied de page, un groupe de
#   téléchargements DSFR strict (`div.fr-downloads-group li`) reprenant les
#   mêmes bulletins un par un — chaque bulletin étant un
#   `<li><a class="fr-link fr-link--download">` portant à la fois le titre
#   ET le lien PDF DIRECT, comme prefecture-01/13/17/18/19/33/2A/77. Pas de
#   page de détail intermédiaire.
#   PARTICULARITÉ (même famille de bug que prefecture-2A, découverte par
#   inspection directe du HTML brut cette fois, PAS seulement en live-drift) :
#   le HTML réel de CET `<a>`, dans le groupe de téléchargements, est
#   malformé — `<a id= class="fr-link fr-link--download" href="...">`,
#   l'attribut `id` sans valeur (ni guillemets ni espace avant le nom de
#   l'attribut suivant) fait que `htmlparser2`/`cheerio` absorbe
#   `class="…"` dans la valeur de `id` au lieu de le traiter comme un
#   attribut `class` distinct : un sélecteur `a.fr-link--download` ne
#   matche donc JAMAIS contre le DOM réellement parsé, bien que la classe
#   soit visible dans le texte source brut. Comme chaque `<li>` du groupe de
#   téléchargements ne contient jamais qu'un seul `<a>` (vérifié 9/9 sur la
#   page du mois d'août 2026), `selecteur_titre`/`selecteur_lien_pdf`
#   utilisent simplement `"a"` plutôt qu'un sélecteur de classe — même
#   contournement générique que prefecture-2A, pas une nouvelle capacité
#   moteur.
# - Navigation à 2 niveaux au total (racine → année → mois) : AUCUNE
#   extension moteur nécessaire, le moteur boucle déjà sur un nombre
#   arbitraire d'étapes de `navigation`.
# - Page NON paginée (9 bulletins du mois d'août 2026 au moment de la
#   capture, tous sur une seule page HTML) : comme la majorité des
#   connecteurs déployés, aucune étape de pagination nécessaire.
#
# Comme les autres connecteurs déployés : le nom du bulletin
# ("Télécharger RAA n°09 du 13 août 2026") ne mentionne jamais son contenu
# réglementaire — c'est le moteur `page_web` (scan de contenu PDF) qui
# retente la pertinence sur le texte du PDF avant d'abandonner un candidat.
#
# Référence d'arrêté réelle vérifiée au format "2B-AAAA-MM-JJ-NNNNN" (ex.
# "Arrêté n° 2B-2026-08-12-00001", parfois "2B-2026-08-10-0001" — nombre de
# chiffres du dernier segment variable), relevée sur plusieurs vrais PDF
# téléchargés : couverte par `pattern_reference` existant. Signataire réel
# relevé sur plusieurs vrais PDF : "La Préfète de la Haute-Corse" (forme
# féminine, jamais rencontrée jusqu'ici parmi les 22 connecteurs précédents,
# tous "Le Préfet"/"Le préfet").
#
# Formulation exacte du texte réglementaire d'un arrêté anti rave-party à
# l'intérieur d'un vrai PDF NON vérifiée (aucun bulletin réel disponible au
# moment de la capture ne portait sur un rassemblement musical non déclaré —
# même limite que les 22 connecteurs précédents) — `patterns_dates` reprend
# l'hypothèse déjà posée ailleurs — à confirmer avant collecte réelle.
type_connecteur: page_web
url_liste: "https://www.haute-corse.gouv.fr/Publications/Publications-administratives-et-legales/Recueils-des-actes-administratifs"
navigation:
  # Racine → carte de l'année courante (href se termine par "-{annee}").
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "-{annee}$"
  # Page de l'année → carte du mois courant (href se termine par
  # "-mois-de-{mois_fr_minuscule}-{annee}" ou "-mois-d-{mois_fr_minuscule}-{annee}"
  # selon élision devant voyelle, ex. "-mois-d-aout-2026").
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "mois-(de-|d-){mois_fr_minuscule}-{annee}$"
selecteur_publications: "div.fr-downloads-group li"
# Même lien porte le titre ET l'URL du PDF (comme prefecture-01/13/17/18/19/33/2A/77).
# "a" (pas "a.fr-link--download") : voir la note ci-dessus sur le HTML
# malformé qui empêche tout sélecteur de classe de matcher cet élément.
selecteur_titre: "a"
selecteur_lien_pdf: "a"
autorite_signataire: "La Préfète de la Haute-Corse"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"
