# backend/src/connecteurs/configs/prefecture-13.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture des
# Bouches-du-Rhône (T033). Même patron que prefecture-77.yaml — seules
# les valeurs changent (contrat §6, règle 7 : aucune variation ne passe
# par le moteur lui-même).
#
# Sélecteurs CSS non vérifiés en conditions réelles contre le HTML actuel
# de bouches-du-rhone.gouv.fr (pas d'accès web sortant depuis cet
# environnement) — à confirmer/affiner avant la première collecte réelle
# (registre-sources.yaml, notes du département 13 : "archives classées
# par année"). En cas de désaccord avec le HTML réel, le connecteur
# échoue explicitement (echec_global) plutôt que de produire un résultat
# silencieusement faux (contrat §6, règles 2 et 6).
type_connecteur: page_web
url_liste: "https://www.bouches-du-rhone.gouv.fr/Publications/RAA-et-Archives"
selecteur_publications: ".raa-liste .raa-item"
selecteur_titre: ".raa-item__titre"
selecteur_lien_pdf: ".raa-item__piece-jointe a[href$='.pdf']"
autorite_signataire: "Le Préfet des Bouches-du-Rhône"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du (?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au (?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté n°\\s*(?<reference>[A-Z0-9-]+)"
