# backend/src/connecteurs/configs/prefecture-65.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture des
# Hautes-Pyrénées. VALIDÉE PAR CAPTURE LIVE (navigateur Chrome réel) le
# 2026-08-20 (lot 62-66) — cf. claude/etat-connecteurs.md.
#
# Structure confirmée en live sur ".../Publications/Recueil-d-actes-administratifs" :
# navigation à UN niveau (racine → carte de l'année, motif "RAA-{annee}$")
# vers une page listant TOUS les numéros de l'année SANS pagination (297
# publications sur une seule page au 2026-08-20, triées du plus récent au
# plus ancien dans le DOM — sans incidence, tous les éléments sont lus) —
# pas de page_detail, liste plate, chaque publication dans un
# `<div class="">` contenant un unique `a.fr-link--download` — même
# famille exacte que prefecture-37/41/45/49/52/55/59/62.
#
# La préfète des Hautes-Pyrénées est une femme (Mme Sibylle SAMOYAULT,
# nommée ~juillet 2026, succède à M. Jean Salomon parti dans l'Yonne) :
# grammaire au féminin.
type_connecteur: page_web
url_liste: "https://www.hautes-pyrenees.gouv.fr/Publications/Recueil-d-actes-administratifs"
navigation:
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "RAA-{annee}$"
selecteur_publications: "div[class='']:has(a.fr-link--download)"
selecteur_titre: "a.fr-link--download"
selecteur_lien_pdf: "a.fr-link--download"
autorite_signataire: "La préfète des Hautes-Pyrénées"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"

# feature 005 (backfill historique, 2026-09-04) : navigation year-scoped (aucune etape
# ne depend du mois cible), la meme page couvre donc tous les mois d'une meme annee -
# cf. config.schema.ts (granularite_liste) et registre-sources.yaml pour la justification
# structurelle relevee sur ce connecteur.
granularite_liste: annuelle
