# backend/src/connecteurs/configs/prefecture-45.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture du Loiret.
# VALIDÉE PAR CAPTURE LIVE (navigateur Chrome réel) le 2026-08-19 — cf.
# claude/etat-connecteurs.md pour le contexte (WebFetch bloqué sur tous les
# sous-chemins de ce domaine dans le sandbox cloud ; validation faite via
# navigation Chrome réelle côté utilisateur).
#
# PIÈGE CONFIRMÉ EN LIVE : le RAA du Loiret existe en DEUX déclinaisons —
# "Recueil des actes administratifs régionaux" (région Centre-Val de Loire)
# et "Recueil des actes administratifs départementaux" (Loiret seul). Seule
# la déclinaison DÉPARTEMENTALE est pertinente (arrêtés préfectoraux
# départementaux) ; `url_liste` cible directement cette page (fixe, pas de
# navigation supplémentaire nécessaire pour l'atteindre).
#
# Structure confirmée en live sur
# ".../Recueil-des-actes-administratifs-departementaux" : contrairement au
# reste du lot, PAS de carte "année" intermédiaire — les 9 mois de l'année
# courante (janvier→septembre 2026 constatés) sont directement des cartes
# `.fr-card__title a` sur cette page racine, à côté des cartes des années
# archivées (2025, 2024...). Un SEUL niveau de navigation suffit donc,
# motif `"/{mois_fr}-{annee}$"` (ex. ".../Aout-2026"). Casse incohérente
# observée sur le site réel (ex. "JUIN-2026" tout en majuscules alors que
# les autres mois sont capitalisés) — sans impact, le moteur compile le
# motif en regex insensible à la casse (`resoudreNavigation`).
#
# `selecteur_publications`/`selecteur_titre`/`selecteur_lien_pdf` : même
# famille que prefecture-37/41 — liste plate
# `div[class='']:has(a.fr-link--download)`, CONFIRMÉE en live sur
# ".../Aout-2026" : 16 correspondances qualifiées vs 20 pour le sélecteur
# non qualifié `div:has(...)` (même bug de sur-correspondance `:has()`
# documenté pour 37/41 — la qualification reste nécessaire ici aussi). Pas
# de pagination sur cette page (16 bulletins tous sur une seule page).
#
# `autorite_signataire` : décret de nomination du 22 avril 2026 (Légifrance)
# — M. Hugues Moutouh, préfet de la région Centre-Val de Loire, préfet du
# Loiret.
type_connecteur: page_web
url_liste: "https://www.loiret.gouv.fr/Publications/Recueil-des-actes-administratifs/Recueil-des-actes-administratifs-departementaux"
navigation:
  # Racine (déjà la page "départementaux") → carte du mois courant
  # (confirmée en live : ".../Recueil-des-actes-administratifs-departementaux/Aout-2026").
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "/{mois_fr}-{annee}$"
selecteur_publications: "div[class='']:has(a.fr-link--download)"
selecteur_titre: "a.fr-link--download"
selecteur_lien_pdf: "a.fr-link--download"
autorite_signataire: "Le préfet du Loiret"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"
