# backend/src/connecteurs/configs/prefecture-11.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture de l'Aude.
# Sélecteurs établis le 2026-08-14 (Phase 5bis élargie 3) contre une capture
# réelle du site (fetch direct depuis le sandbox cloud).
#
# Structure réelle : `url_liste` RACINE liste une carte par année
# (`.fr-card__title a`, href se terminant par "-2026") ; la page de l'année
# liste une carte par mois, SANS suffixe d'année dans l'URL du mois (href se
# terminant par "/Aout", pas "/Aout-2026" — même particularité que
# prefecture-07) ; la page du mois est en PLATE, non paginée (15 bulletins
# pour août 2026 au moment de la capture, ordre chronologique CROISSANT mais
# tous déjà sur une seule page — aucune étape "dernière page" nécessaire).
#
# Piège identique à prefecture-05/07/08/09 : TOUS les liens de téléchargement
# de la page finale portent le bug de markup `<a id= class="fr-link
# fr-link--download">` (id sans valeur, casse l'attribut `class`) —
# `selecteur_titre`/`selecteur_lien_pdf` ciblent donc directement
# `a[href$='.pdf']`.
#
# Noms de fichiers ("RAA SPECIAL N° 15_AOÛT 2026") numérotés en séquence
# mensuelle (01 à N par mois), sans rapport avec le numéro de référence
# interne d'un arrêté — contrairement à prefecture-12/14/15/16 où le nom du
# fichier reprend directement la référence du recueil, aucune séquence
# globale exploitable n'a été trouvée sur ce site pour choisir un numéro de
# référence "réaliste" ; le format `{dept}-2026-08-{num}` déjà utilisé pour
# tous les connecteurs précédents (hypothèse jamais vérifiée contre un vrai
# PDF, indépendante du nom de fichier du bulletin) est repris tel quel.
#
# Comme les autres connecteurs déployés : le nom du bulletin ne mentionne
# jamais son contenu — c'est le moteur `page_web` (scan de contenu PDF) qui
# retente la pertinence sur le texte du PDF avant d'abandonner un candidat.
#
# Formulation exacte du texte réglementaire à l'intérieur d'un vrai PDF NON
# vérifiée (même limite que les connecteurs précédents — aucun PDF binaire
# réel téléchargé) — `patterns_dates`/`pattern_reference` reprennent
# l'hypothèse déjà posée ailleurs — à confirmer avant collecte réelle.
type_connecteur: page_web
url_liste: "https://www.aude.gouv.fr/Publications/Recueil-des-Actes-Administratifs-RAA"
navigation:
  # Racine → carte de l'année courante (href se termine par "-2026").
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "-{annee}$"
  # Page de l'année → carte du mois courant (href se termine par "/Aout",
  # SANS suffixe d'année — comme prefecture-07).
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "/{mois_fr}$"
selecteur_publications: ".fr-downloads-group li"
# Cible directement l'attribut href (classe cassée sur cette page — cf.
# commentaire ci-dessus).
selecteur_titre: "a[href$='.pdf']"
selecteur_lien_pdf: "a[href$='.pdf']"
autorite_signataire: "Le Préfet de l'Aude"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"
