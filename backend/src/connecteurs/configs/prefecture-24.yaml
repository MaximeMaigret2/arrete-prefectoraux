# backend/src/connecteurs/configs/prefecture-24.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture de la
# Dordogne. Sélecteurs établis le 2026-08-14 contre une capture réelle du
# site (fetch direct depuis le sandbox cloud).
#
# Structure réelle (cf. fixtures/connecteurs/reel/prefecture-24/SOURCE.md
# pour le détail complet) :
# - `url_liste` (racine) liste une carte DSFR par ANNÉE (`.fr-card__title
#   a`, href se terminant par `Annee-{annee}`), comme prefecture-01/13/18/
#   19/23/33/77.
# - La page de l'année liste une carte DSFR par MOIS (`.fr-card__title a`,
#   href se terminant par `{Mois}-{annee}`, ex. `Aout-2026`) — SANS accent
#   ("Aout" pas "Août"), avec majuscule initiale seulement (contrairement à
#   22 qui utilise des MAJUSCULES intégrales dans l'URL) — même famille de
#   navigation à 3 niveaux que prefecture-01/06/09/18.
# - La page du mois liste chaque bulletin comme une carte DSFR complète
#   (`div.fr-card`, comme prefecture-17/22), avec le lien PDF DIRECT porté
#   par `h2.fr-card__title a` (`class="fr-card__link menu-item-link"`) —
#   pas de page de détail intermédiaire.
# - Page NON paginée (4 bulletins pour Août 2026 au moment de la capture,
#   14/08/2026 inclus — le mois n'ayant débuté que le 05/08).
#
# Signataire réel : « La préfète de la Dordogne » (confirmée par le logo
# textuel DSFR de chaque carte, « préfète<br />de la Dordogne » — aucun
# bloc de signature explicite trouvé dans les 2 vrais PDF échantillonnés,
# qui portaient sur des sujets de délégation de signature interne sans
# bloc "Fait à ... / La préfète," classique).
#
# Formulation exacte du texte réglementaire à l'intérieur d'un vrai PDF NON
# vérifiée (aucun arrêté anti rave-party réel trouvé dans les 2 échantillons
# téléchargés) — `patterns_dates`/`pattern_reference` reprennent l'hypothèse
# générique déjà posée pour la plupart des connecteurs précédents.
type_connecteur: page_web
url_liste: "https://www.dordogne.gouv.fr/Publications/Recueil-des-actes-administratifs"
navigation:
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "Annee-{annee}$"
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "{mois_fr}-{annee}$"
selecteur_publications: "div.fr-card"
selecteur_titre: "h2.fr-card__title a"
selecteur_lien_pdf: "h2.fr-card__title a"
autorite_signataire: "La préfète de la Dordogne"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"
