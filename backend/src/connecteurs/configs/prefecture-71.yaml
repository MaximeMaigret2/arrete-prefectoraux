# backend/src/connecteurs/configs/prefecture-71.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture de
# Saône-et-Loire. VALIDÉE PAR CAPTURE LIVE (navigateur Chrome réel) le
# 2026-08-21 (lot 67-71) — cf. claude/etat-connecteurs.md.
#
# Structure confirmée en live sur
# ".../Publications/Recueil-des-actes-administratifs" : PAS de carte
# d'année — `url_liste` EST directement la liste paginée de toutes les
# publications, triée du plus récent au plus ancien (227 pages de 10
# `.fr-card` au 2026-08-21, page 1 suffit) — SANS `navigation`, même
# famille que prefecture-70.
#
# Piège `page_detail` sur carte DSFR (cf. règle lot 58-61) :
# `selecteur_publications` doit être l'`<a>` lui-même (`.fr-card__title a`),
# jamais le conteneur `.fr-card`.
#
# PARTICULARITÉ propre à ce site : le lien PDF de la page de détail n'a
# PAS la classe `fr-link--download` habituelle (`class=""`, markup
# irrégulier constaté en live — l'attribut `id` de ce lien contient même
# littéralement la chaîne `class="fr-link` par erreur de balisage côté
# site, sans rapport avec le moteur). `selecteur_lien_pdf` cible donc
# l'attribut `href` directement (`a[href*='telechargement']`) plutôt que
# la classe CSS habituelle — vérifié qu'un seul lien de ce type est
# présent par page de détail (2 pages de détail différentes vérifiées en
# live).
type_connecteur: page_web
url_liste: "https://www.saone-et-loire.gouv.fr/Publications/Recueil-des-actes-administratifs"
navigation: []
selecteur_publications: ".fr-card__title a"
# Sélecteur factice volontairement sans correspondance (l'<a> n'a pas de
# descendant pertinent) — repli sur $publication.text(), même idiome que
# 58/60/70.
selecteur_titre: ".jamais-de-descendant-dans-un-lien"
selecteur_lien_pdf: "a[href*='telechargement']"
page_detail: {}
autorite_signataire: "Le préfet de Saône-et-Loire"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"
