# backend/src/connecteurs/configs/prefecture-42.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture de la Loire.
# VALIDÉE PAR CAPTURE LIVE (navigateur Chrome réel) le 2026-08-19 — cf.
# claude/etat-connecteurs.md pour le contexte (WebFetch bloqué sur tous les
# sous-chemins de ce domaine dans le sandbox cloud ; validation faite via
# navigation Chrome réelle côté utilisateur, dès la construction initiale de
# cette config — méthode recommandée après le taux d'erreur du lot 37-41).
#
# Structure confirmée en live sur
# ".../Recueil-des-Actes-Administratifs" : le site a migré (au moins pour
# les années récentes, 2024-2026) vers une carte annuelle unique
# "{annee} numéros spéciaux" — PAS de carte "numéros mensuels" pour l'année
# courante (cette famille de carte n'existe plus que pour 2022/2023, non
# pertinente). Cette carte mène DIRECTEMENT à une liste plate de 146
# bulletins (aucune pagination, tous sur une seule page HTML), classée par
# ordre chronologique CROISSANT (le plus récent en dernier).
#
# `selecteur_publications`/`selecteur_titre`/`selecteur_lien_pdf` :
# `.fr-downloads-group li` (le conteneur) confirmé en live — 146
# correspondances exactes (`li` scopé au conteneur `.fr-downloads-group`,
# un seul sur la page), chaque `<li>` n'ayant qu'un seul enfant, l'ancre
# `<a>` elle-même (pas de classe sur l'ancre ni le `<li>` — à la différence
# de `a.fr-link--download` utilisé par 37/38/40/41). `selecteur_titre`/
# `selecteur_lien_pdf: "a"` retrouvent cette même ancre comme descendant du
# `<li>` (texte complet du lien = libellé + taille + date, href = PDF réel).
#
# `autorite_signataire` confirmée (décret de nomination du 22 avril 2026,
# Légifrance, remplaçant Mme Muriel Nguyen du 30 juillet 2025) :
# M. François-Xavier Bieuville.
type_connecteur: page_web
url_liste: "https://www.loire.gouv.fr/Publications/Publications-legales/Recueil-des-Actes-Administratifs"
navigation:
  # Racine → carte de l'année courante (confirmée en live :
  # ".../Recueil-des-Actes-Administratifs/2026-numeros-speciaux").
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "{annee}-numeros-speciaux$"
selecteur_publications: ".fr-downloads-group li"
selecteur_titre: "a"
selecteur_lien_pdf: "a"
autorite_signataire: "Le préfet de la Loire"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"

# feature 005 (backfill historique, 2026-09-04) : navigation year-scoped (aucune etape
# ne depend du mois cible), la meme page couvre donc tous les mois d'une meme annee -
# cf. config.schema.ts (granularite_liste) et registre-sources.yaml pour la justification
# structurelle relevee sur ce connecteur.
granularite_liste: annuelle
