# backend/src/connecteurs/configs/prefecture-30.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture du Gard.
# Sélecteurs établis le 2026-08-14 (Phase 5bis élargie 10, lot 26-30) contre
# une capture réelle du site (fetch direct depuis le sandbox cloud).
#
# Structure réelle (cf. fixtures/connecteurs/reel/prefecture-30/SOURCE.md
# pour le détail complet) :
# - `url_liste` (racine) liste une carte DSFR par ANNÉE (`.fr-card__title
#   a`, href se terminant par `-{annee}`).
# - La page de l'année est DÉJÀ la liste complète (pas de découpage par
#   mois, comme prefecture-16/25/29) : chaque bulletin est un `<div
#   class="">` contenant un unique `<a class="fr-link fr-link--download">`
#   — même famille que prefecture-21/23/25/26/28/29. 175 bulletins pour 2026
#   au moment de la capture (14/08 inclus, jusqu'à `recueil-30-2026-178`),
#   en ordre chronologique CROISSANT (le plus ancien en tête, à la
#   différence de 29/Finistère) — sans incidence, tous sur une seule page
#   (aucun `fr-pagination` détecté), les plus récents restent accessibles en
#   fin de page.
#
# PIÈGE (identique à prefecture-26/28/29, même session) : `div:has(a.fr-link--download)`
# seul matche aussi les `<div>` ANCÊTRES du lien (180 correspondances contre
# la page réelle capturée, pour seulement 175 bulletins réels — même
# structure en table qu'sur prefecture-29). `selecteur_publications` cible
# donc `div[class=""]:has(a.fr-link--download)` — 175/175 correspondances
# exactes vérifiées.
#
# Signataire réel : « Préfete<br />du Gard » (logo textuel DSFR de chaque
# carte, féminin — orthographe corrigée en « Préfète » avec accent grave
# dans `autorite_signataire` ci-dessous, le logo DSFR omettant l'accent,
# comme la coquille déjà rencontrée sur prefecture-25/Doubs).
#
# LIMITE DE CAPTURE : comme prefecture-27/28/29, le endpoint
# `/contenu/telechargement/...` de ce site refuse systématiquement les
# téléchargements automatisés depuis le sandbox cloud de cette session
# (connexion TLS fermée sans réponse) — aucun vrai PDF n'a pu être
# échantillonné, malgré un bulletin très récent (`recueil-30-2026-178-special
# du 14 08 2026`) dont le titre seul ne permet pas de préjuger du contenu.
# `bulletin-avec-arrete.pdf`/`bulletin-sans-arrete-pertinent.pdf` sont donc
# synthétiques (`reportlab`) ; `patterns_dates`/`pattern_reference`
# reprennent l'hypothèse générique déjà posée pour la plupart des
# connecteurs précédents.
type_connecteur: page_web
url_liste: "https://www.gard.gouv.fr/Publications/Recueil-des-Actes-Administratifs"
navigation:
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "-{annee}$"
selecteur_publications: "div[class='']:has(a.fr-link--download)"
selecteur_titre: "a.fr-link--download"
selecteur_lien_pdf: "a.fr-link--download"
autorite_signataire: "La Préfète du Gard"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"

# feature 005 (backfill historique, 2026-09-04) : navigation year-scoped (aucune etape
# ne depend du mois cible), la meme page couvre donc tous les mois d'une meme annee -
# cf. config.schema.ts (granularite_liste) et registre-sources.yaml pour la justification
# structurelle relevee sur ce connecteur.
granularite_liste: annuelle
