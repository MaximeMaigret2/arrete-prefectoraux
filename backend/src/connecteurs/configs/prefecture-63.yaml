# backend/src/connecteurs/configs/prefecture-63.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture du Puy-de-Dôme.
# VALIDÉE PAR CAPTURE LIVE (navigateur Chrome réel) le 2026-08-20 (lot 62-66)
# — cf. claude/etat-connecteurs.md.
#
# Structure confirmée en live sur ".../Publications/Recueils-des-actes-administratifs" :
# navigation à DEUX niveaux — 1. racine → carte "thématique" fixe
# (motif ancré "Recueils-des-actes-administratifs-Puy-de-Dome$", pour écarter
# la carte sœur "...-Auvergne" présente sur la même page) ; 2. → carte de
# l'année ("{annee}$"). Cette dernière carte pointe vers une URL qui répond
# par une VRAIE redirection HTTP (`fetch().redirected === true`, vérifié en
# live : ".../Recueils-des-actes-administratifs-Puy-de-Dome/2026" →
# ".../2026/2026") — `fetch()` natif suit les redirections par défaut, donc
# aucune étape de navigation supplémentaire n'est nécessaire (même
# mécanisme que le mois "spéciaux uniquement" de prefecture-61/Orne). Page
# finale : liste plate SANS pagination (221 publications sur une seule page
# au 2026-08-20), chaque publication dans un `<div class="">` contenant un
# unique `a.fr-link--download` — même famille que prefecture-37/41/45/49/52/55/59/62.
#
# La préfète du Puy-de-Dôme est une femme (Mme FRACKOWIAK-JACOBS, décret de
# nomination du 17 décembre 2025, Légifrance) : grammaire au féminin.
type_connecteur: page_web
url_liste: "https://www.puy-de-dome.gouv.fr/Publications/Recueils-des-actes-administratifs"
navigation:
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "Recueils-des-actes-administratifs-Puy-de-Dome$"
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "{annee}$"
selecteur_publications: "div[class='']:has(a.fr-link--download)"
selecteur_titre: "a.fr-link--download"
selecteur_lien_pdf: "a.fr-link--download"
autorite_signataire: "La préfète du Puy-de-Dôme"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"
