# backend/src/connecteurs/configs/prefecture-39.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture du Jura.
# VALIDÉE PAR CAPTURE LIVE (navigateur Chrome réel) le 2026-08-18 — cf.
# claude/etat-connecteurs.md pour le contexte (WebFetch bloqué sur tous les
# sous-chemins de ce domaine dans le sandbox cloud ; validation faite via
# navigation Chrome réelle côté utilisateur).
#
# CORRECTION IMPORTANTE par rapport à l'hypothèse initiale (extrapolée par
# recherche web) : PAS de `page_detail`. Confirmé en live sur
# ".../Recueil-des-Actes-Administratifs/Annee-2026" : le lien de carte
# `.fr-card__link` (dans `.fr-card__title`, class complète observée
# "fr-card__link menu-item-link") pointe DIRECTEMENT vers le fichier PDF
# (ex. "/contenu/telechargement/36948/274727/file/RAA 39-2026-08-012 du
# 18-08-2026.pdf"), pas vers une page de détail intermédiaire — à la
# différence de prefecture-40/Landes qui, elle, utilise bien une page de
# détail (cf. prefecture-40.yaml). Même famille que prefecture-36/Indre
# (lien PDF direct porté par `.fr-card__title a`) : `selecteur_publications`
# cible le conteneur `.fr-card__title` (pas le lien lui-même) pour que
# `selecteur_titre`/`selecteur_lien_pdf` puissent le retrouver par
# recherche de descendant.
#
# PAGINATION CONFIRMÉE EN LIVE (absente de la version précédente de cette
# config) : la page de l'année 2026 a `.fr-pagination__link--last` avec
# href "..../Annee-2026/(offset)/170" (18 pages de 10 bulletins, du plus
# ancien au plus récent — la dernière page contient donc les bulletins les
# plus récents). Étape de navigation ajoutée, `optionnelle: true` comme
# pour prefecture-02/36/40 (années avec ≤10 bulletins, sans pagination).
#
# `url_liste` confirmé par l'URL indexée
# `.../Publications/Publications-legales/Recueil-des-Actes-Administratifs`
# (chemin à 2 segments "Publications-legales", différent de 37/38/41).
# `autorite_signataire` confirmée (décret de nomination le plus récent
# trouvé, 12 mars 2025, Légifrance) : M. Pierre-Édouard Colliex — un décret
# antérieur mentionnait M. Fabrice Macquat, remplacé depuis.
type_connecteur: page_web
url_liste: "https://www.jura.gouv.fr/Publications/Publications-legales/Recueil-des-Actes-Administratifs"
navigation:
  # Racine → carte de l'année courante (confirmée en live :
  # ".../Recueil-des-Actes-Administratifs/Annee-2026").
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "-{annee}$"
  # Dernière page de pagination (bulletins les plus récents de l'année) —
  # optionnelle : absente pour les années avec ≤10 bulletins.
  - selecteur_liens: ".fr-pagination__link--last"
    pattern_lien: "\\(offset\\)/\\d+$"
    optionnelle: true
selecteur_publications: ".fr-card__title"
# Le lien direct (`a.fr-card__link`) est un descendant de `.fr-card__title`
# (le conteneur ci-dessus) : ni page de détail, ni repli sur le texte du
# conteneur — juste une recherche de descendant classique.
selecteur_titre: "a.fr-card__link"
selecteur_lien_pdf: "a.fr-card__link"
autorite_signataire: "Le préfet du Jura"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"
