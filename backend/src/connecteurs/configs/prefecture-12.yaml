# backend/src/connecteurs/configs/prefecture-12.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture de l'Aveyron.
# Sélecteurs établis le 2026-08-14 (Phase 5bis élargie 3) contre une capture
# réelle du site (fetch direct depuis le sandbox cloud).
#
# Structure réelle : `url_liste` RACINE liste une carte par année, nommée
# "Recueils-{annee}" plutôt que "Annee-{annee}" (href se terminant par
# "-2026" — même motif `pattern_lien` que les connecteurs "Annee-" grâce au
# suffixe commun) ; la page de l'année liste une carte par mois (href se
# terminant par "-Aout-2026") ; la page du mois est en PLATE, non paginée
# (40 bulletins pour août 2026 au moment de la capture, ordre chronologique
# CROISSANT mais tous déjà sur une seule page).
#
# Piège identique à prefecture-05/07/08/09/11 : TOUS les liens de
# téléchargement de la page finale portent le bug de markup `<a id=
# class="fr-link fr-link--download">` — `selecteur_titre`/`selecteur_lien_pdf`
# ciblent donc directement `a[href$='.pdf']`.
#
# Seul connecteur de cette session où le nom du fichier ("RAA N°12-2026-553
# du 14 août 2026") reprend directement une numérotation séquentielle
# globale exploitable ("12-2026-{num}") — utilisée pour choisir un numéro de
# référence réaliste dans les PDF synthétiques de cette fixture.
#
# Comme les autres connecteurs déployés : le nom du bulletin ne mentionne
# jamais son contenu réglementaire — c'est le moteur `page_web` (scan de
# contenu PDF) qui retente la pertinence sur le texte du PDF avant
# d'abandonner un candidat.
#
# Formulation exacte du texte réglementaire à l'intérieur d'un vrai PDF NON
# vérifiée (même limite que les connecteurs précédents) —
# `patterns_dates`/`pattern_reference` reprennent l'hypothèse déjà posée
# ailleurs — à confirmer avant collecte réelle.
type_connecteur: page_web
url_liste: "https://www.aveyron.gouv.fr/Publications/Recueil-des-actes-administratifs"
navigation:
  # Racine → carte de l'année courante (href se termine par "-2026", carte
  # nommée "Recueils-2026").
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "-{annee}$"
  # Page de l'année (elle-même paginée à 10 cartes/page, mais le mois
  # courant figure toujours dans les 10 premiers mois de l'année en cours,
  # donc sur la page 1) → carte du mois courant (href se termine par
  # "/Aout-2026").
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "/{mois_fr}-{annee}$"
selecteur_publications: ".fr-downloads-group li"
# Cible directement l'attribut href (classe cassée sur cette page — cf.
# commentaire ci-dessus).
selecteur_titre: "a[href$='.pdf']"
selecteur_lien_pdf: "a[href$='.pdf']"
autorite_signataire: "Le Préfet de l'Aveyron"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"
