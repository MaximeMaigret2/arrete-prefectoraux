# backend/src/connecteurs/configs/prefecture-82.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture de
# Tarn-et-Garonne. VALIDÉE PAR CAPTURE LIVE (navigateur Chrome réel) le
# 2026-08-21 (lot 78-82) — cf. claude/etat-connecteurs.md.
#
# Structure confirmée en live sur ".../Publications/Recueils-des-actes-administratifs" :
# navigation à DEUX niveaux — racine → carte de l'année (motif
# "RAA-de-{annee}$") → carte du mois. Liste finale (mois courant) :
# liste PLATE sans pagination (9 publications en août 2026 au
# 2026-08-21), chaque publication dans un `div[class='']` contenant un
# unique `a.fr-link--download` — même famille exacte que
# 37/41/45/49/52/55/59/62/65/66/69/72/73/76/78/80.
#
# PARTICULARITÉ du motif de l'étape mois (même piège qu'au lot 67-71,
# prefecture-69/Rhône) : le slug alterne entre "RAA-de-{Mois}-{annee}"
# (janvier, février, mars, mai, juin, juillet, septembre, octobre,
# novembre, décembre — mois commençant par une consonne) et
# "RAA-d-{Mois}-{annee}" (avril, août — élision "d'avril"/"d'août" devant
# voyelle, vérifiée en live : href exact ".../RAA-d-Aout-2026", capitalisé
# comme les autres mois). D'où le motif `"RAA-d(e)?-{mois_fr}-{annee}$"`,
# qui couvre les deux formes sans dépendre du mois courant.
type_connecteur: page_web
url_liste: "https://www.tarn-et-garonne.gouv.fr/Publications/Recueils-des-actes-administratifs"
navigation:
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "RAA-de-{annee}$"
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "RAA-d(e)?-{mois_fr}-{annee}$"
selecteur_publications: "div[class='']:has(a.fr-link--download)"
selecteur_titre: "a.fr-link--download"
selecteur_lien_pdf: "a.fr-link--download"
autorite_signataire: "Le préfet de Tarn-et-Garonne"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"
