# backend/src/connecteurs/configs/prefecture-43.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture de la
# Haute-Loire. VALIDÉE PAR CAPTURE LIVE (navigateur Chrome réel) le
# 2026-08-19 — cf. claude/etat-connecteurs.md pour le contexte (WebFetch
# bloqué sur tous les sous-chemins de ce domaine dans le sandbox cloud ;
# validation faite via navigation Chrome réelle côté utilisateur).
#
# Structure confirmée en live sur
# ".../Recueils-des-actes-administratifs/Recueil-des-actes-administratifs-2026" :
# même famille que prefecture-42 — liste plate de 190 bulletins DANS
# `.fr-downloads-group` (ordre chronologique croissant), aucune pagination.
#
# PIÈGE CONFIRMÉ EN LIVE : la page contient EN RÉALITÉ 380 ancres
# `a[href$=".pdf"]` au total (190 dans `.fr-downloads-group`, 190
# supplémentaires dans un second bloc — probablement une vue alternative
# dupliquée du même contenu, non identifiée précisément). Un sélecteur non
# qualifié (`a[href$=".pdf"]` seul) aurait donc produit CHAQUE candidat en
# double. `selecteur_publications: ".fr-downloads-group li"` scope
# strictement au premier bloc et retrouve exactement les 190 hrefs uniques
# (vérifié en live par comparaison d'ensembles) — même principe de
# qualification de sélecteur que 37/41/45 (sur-correspondance `:has()`),
# ici une duplication de bloc plutôt qu'un ancêtre trop large.
#
# `autorite_signataire` confirmée directement sur la page officielle du
# corps préfectoral (https://www.haute-loire.gouv.fr/.../Le-prefet-de-la-Haute-Loire,
# mise à jour 25/06/2024, décret de nomination du 13 juillet 2023,
# Légifrance) : M. Yvan Cordier.
type_connecteur: page_web
url_liste: "https://www.haute-loire.gouv.fr/Publications/Recueils-des-actes-administratifs"
navigation:
  # Racine → carte de l'année courante (confirmée en live :
  # ".../Recueils-des-actes-administratifs/Recueil-des-actes-administratifs-2026").
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "-{annee}$"
selecteur_publications: ".fr-downloads-group li"
selecteur_titre: "a"
selecteur_lien_pdf: "a"
autorite_signataire: "Le préfet de la Haute-Loire"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"

# feature 005 (backfill historique, 2026-09-04) : navigation year-scoped (aucune etape
# ne depend du mois cible), la meme page couvre donc tous les mois d'une meme annee -
# cf. config.schema.ts (granularite_liste) et registre-sources.yaml pour la justification
# structurelle relevee sur ce connecteur.
granularite_liste: annuelle
