# backend/src/connecteurs/configs/prefecture-21.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture de la
# Côte-d'Or. Sélecteurs établis le 2026-08-14 contre une capture réelle du
# site (fetch direct depuis le sandbox cloud).
#
# Structure réelle (cf. fixtures/connecteurs/reel/prefecture-21/SOURCE.md
# pour le détail complet) :
# - `url_liste` (racine) liste DEUX cartes DSFR (`.fr-card__title a`) :
#   « Recueils des actes administratifs de l'année en cours » et
#   « ... des années antérieures » (+ une FAQ, sans intérêt) — DÉSAMBIGUÏSATION
#   nécessaire comme prefecture-2A, la racine n'étant pas dédiée à un seul
#   flux. `pattern_lien: "-de-l-annee-en-cours$"` cible spécifiquement la
#   première carte (jamais un texte affiché, toujours l'URL résolue, comme
#   toute étape de `navigation`).
# - La page "année en cours" liste DIRECTEMENT tous les bulletins de
#   l'année (142 au moment de la capture), regroupés visuellement par des
#   en-têtes `<p><b><b>Mois AAAA</b></b></p>` (purement indicatifs, aucun
#   sélecteur ne s'appuie dessus) — même famille que prefecture-19, mais
#   ICI chaque bulletin est un `<li>` NU (aucune classe, aucun `<div>`
#   englobant comme 19's `div.fr-text--lead`) contenant un unique
#   `<a class="fr-link fr-link--download">` portant titre + lien PDF
#   DIRECT. Comme la page contient aussi d'autres `<li>` sans rapport
#   (menu latéral, fil d'Ariane, liens d'évitement), `selecteur_publications`
#   utilise un sélecteur `:has()` (CSS4, supporté nativement par la version
#   de `cheerio` du moteur — aucune extension moteur nécessaire, un
#   sélecteur CSS déclaratif de plus) pour ne cibler QUE les `<li>`
#   contenant effectivement un tel lien : `"li:has(a.fr-link--download)"`.
# - Page NON paginée (142 bulletins de l'année 2026 au moment de la
#   capture, tous sur une seule page HTML, comme prefecture-01/03/13/17/
#   18/19/33) : aucune étape de pagination nécessaire.
# - `id=` présent (non vide) mais SANS guillemets sur chaque lien de
#   téléchargement (ex. `id=542e263b866a438c6b70ec12a913b761`) — cheerio/
#   htmlparser2 parse correctement un attribut non quoté tant qu'il a une
#   valeur ; contrairement au bug rencontré sur 2A/2B (`id=` VIDE, absorbant
#   la classe suivante), ce cas ne nécessite AUCUN contournement.
#
# Signataire réel confirmé sur 4 vrais PDF téléchargés (98/17/inconnu/33
# pages) : « La préfète de la Côte-d'Or » (parfois « Pour la Préfète et par
# délégation » suivi d'une signature déléguée — sans incidence,
# `autorite_signataire` est une valeur déclarative fixe représentant
# l'autorité légale, jamais extraite du texte).
#
# Comme les autres connecteurs déployés : le nom du bulletin ("RAA n° 142
# du 14 août 2026") ne mentionne jamais son contenu réglementaire — c'est
# le moteur `page_web` (scan de contenu PDF) qui retente la pertinence sur
# le texte du PDF avant d'abandonner un candidat.
#
# Formulation exacte du texte réglementaire à l'intérieur d'un vrai PDF NON
# vérifiée pour ce département (aucun arrêté anti rave-party réel trouvé
# parmi les échantillons téléchargés) — `patterns_dates`/`pattern_reference`
# reprennent l'hypothèse générique déjà posée pour tous les connecteurs
# précédents (à l'exception notable de prefecture-23/Creuse, déployé la
# même session, où un vrai arrêté anti rave-party a été trouvé et a permis
# de calibrer des patterns propres à ce département).
type_connecteur: page_web
url_liste: "https://www.cote-dor.gouv.fr/Publications/Recueils-des-Actes-Administratifs"
navigation:
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "-de-l-annee-en-cours$"
selecteur_publications: "li:has(a.fr-link--download)"
selecteur_titre: "a.fr-link--download"
selecteur_lien_pdf: "a.fr-link--download"
autorite_signataire: "La préfète de la Côte-d'Or"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"
