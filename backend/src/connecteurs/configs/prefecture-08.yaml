# backend/src/connecteurs/configs/prefecture-08.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture des
# Ardennes. Sélecteurs établis le 2026-08-14 (Phase 5bis élargie 2) contre
# une capture réelle du site (fetch direct depuis le sandbox cloud).
#
# Structure réelle, la plus plate des 5 : `url_liste` RACINE liste
# plusieurs cartes, dont une carte "Les actes administratifs de l'année
# 2026" (href se terminant par "-annee-2026", à distinguer de la carte
# "années antérieures" qui ne se termine jamais par une année) menant
# DIRECTEMENT à la liste complète et déjà PLATE de TOUS les bulletins de
# l'année 2026 — un seul niveau de `navigation`, aucun découpage par mois
# dans l'URL (les mois n'apparaissent que comme des intertitres visuels
# `<b>Août 2026</b>` au sein de la même page, jamais comme un lien
# distinct), aucune pagination (258 bulletins pour l'année tiennent sur
# cette seule page). Ordre DÉCROISSANT (le mois en cours, août 2026, en
# tête de page) — confirmé par la position du premier intertitre de mois.
#
# Chaque bulletin est un `<li><div><a class="fr-link fr-link--download"
# href="...pdf">Télécharger RAA 8-2026-129 du 12 aout 2026</a></div></li>`.
# Piège découvert (comme prefecture-05/07, contract §2quater) : la MAJORITÉ
# (129 sur 258 au moment de la capture) de ces liens portent le même bug
# d'attribut — `<a id= class="fr-link fr-link--download">` (id vide,
# casse `class`) — mais pas tous (quelques-uns portent un id hexadécimal
# valide et une classe intacte) ; `selecteur_titre`/`selecteur_lien_pdf`
# ciblent donc directement `a[href$='.pdf']`, seul sélecteur fiable pour
# les 258 bulletins de façon uniforme, plutôt que de dépendre d'une classe
# tantôt présente tantôt cassée. `selecteur_publications` cible la colonne
# de contenu principale (`.fr-col-md-8 li`, 258 correspondances exactes)
# plutôt que `<li>` seul, qui inclurait aussi les quelques éléments de la
# colonne de partage de page (liens Facebook/X, hors colonne principale).
#
# Comme les autres connecteurs déployés : le nom du bulletin ne mentionne
# jamais son contenu — c'est le moteur `page_web` (scan de contenu PDF) qui
# retente la pertinence sur le texte du PDF avant d'abandonner un candidat.
#
# Formulation exacte du texte réglementaire à l'intérieur d'un vrai PDF NON
# vérifiée (même limite que les connecteurs précédents) —
# `patterns_dates`/`pattern_reference` reprennent l'hypothèse déjà posée
# ailleurs — à confirmer avant collecte réelle.
type_connecteur: page_web
url_liste: "https://www.ardennes.gouv.fr/Publications/Recueil-des-actes-administratifs"
navigation:
  # Racine → carte de l'année courante, déjà la liste complète et plate
  # (href se termine par "-annee-2026", donc par "-2026").
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "-{annee}$"
selecteur_publications: ".fr-col-md-8 li"
# Cible directement l'attribut href (classe intermittemment cassée — cf.
# commentaire ci-dessus).
selecteur_titre: "a[href$='.pdf']"
selecteur_lien_pdf: "a[href$='.pdf']"
autorite_signataire: "Le Préfet des Ardennes"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"
