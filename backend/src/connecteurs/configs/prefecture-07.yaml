# backend/src/connecteurs/configs/prefecture-07.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture de l'Ardèche.
# Sélecteurs établis le 2026-08-14 (Phase 5bis élargie 2) contre une capture
# réelle du site (fetch direct depuis le sandbox cloud).
#
# Structure réelle : `url_liste` RACINE liste une carte par année
# (`.fr-card`, href se terminant par "-2026") ; la page de l'année liste une
# carte par MOIS, mais SANS suffixe d'année dans l'URL du mois
# (`/Publications/.../RAA-2026/Aout`, pas "/Aout-2026") — seuls les mois
# jusqu'au mois courant sont présents (8 cartes en août 2026, pas 12), ce
# qui est sans incidence puisque `pattern_lien` cherche seulement le mois
# courant. La page du mois est la liste finale, en PLATE, non paginée (tous
# les bulletins du mois tiennent sur une seule page) : `<div
# class="fr-downloads-group"><ul><li><a class="fr-link fr-link--download"
# href="...pdf">`.
#
# Piège découvert sur cette page (identique à prefecture-05, contract
# §2quater) : le HTML réel de CHAQUE lien de téléchargement y contient un
# bug d'attribut — `<a id= class="fr-link fr-link--download" href="...">`
# (id vide, immédiatement suivi d'un espace puis `class=...`) — qui casse
# l'attribut `class` pour tout parseur HTML conforme (les 9 bulletins du
# mois d'août 2026 présentent tous ce bug, vérifié directement dans le HTML
# brut renvoyé par le serveur). `selecteur_titre`/`selecteur_lien_pdf`
# ciblent donc directement l'attribut `href` (`a[href$='.pdf']`), insensible
# à ce bug, plutôt que la classe `fr-link--download` cassée.
#
# Comme les autres connecteurs déployés : le nom du bulletin ("recueil-
# 07-2026-249-recueil-du 05 août 2026 special-1") ne mentionne jamais son
# contenu — c'est le moteur `page_web` (scan de contenu PDF) qui retente la
# pertinence sur le texte du PDF avant d'abandonner un candidat.
#
# Formulation exacte du texte réglementaire à l'intérieur d'un vrai PDF NON
# vérifiée (même limite que les connecteurs précédents) —
# `patterns_dates`/`pattern_reference` reprennent l'hypothèse déjà posée
# ailleurs — à confirmer avant collecte réelle.
type_connecteur: page_web
url_liste: "https://www.ardeche.gouv.fr/Publications/Recueil-des-actes-administratifs"
navigation:
  # Racine → carte de l'année courante (href se termine par "-2026").
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "-{annee}$"
  # Page de l'année → carte du mois courant (href se termine par "/Aout",
  # SANS suffixe d'année — contrairement à prefecture-06/01).
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "/{mois_fr}$"
selecteur_publications: ".fr-downloads-group li"
# Cible directement l'attribut href (pas la classe, cassée sur cette page —
# cf. commentaire ci-dessus).
selecteur_titre: "a[href$='.pdf']"
selecteur_lien_pdf: "a[href$='.pdf']"
autorite_signataire: "Le Préfet de l'Ardèche"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"
