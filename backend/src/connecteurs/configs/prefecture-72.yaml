# backend/src/connecteurs/configs/prefecture-72.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture de la
# Sarthe. VALIDÉE PAR CAPTURE LIVE (navigateur Chrome réel) le
# 2026-08-21 (lot 72-76) — cf. claude/etat-connecteurs.md.
#
# Structure confirmée en live sur
# ".../Publications/Recueils-des-actes-administratifs" : navigation à UN
# niveau (racine → carte de l'année, motif "RAA-Sarthe-{annee}$", lien
# porté par ".fr-card__title a") vers une page qui liste TOUTES les
# publications de l'année sur une seule page (pas de pagination, pas de
# découpage par mois malgré des en-têtes visuels "AOUT"/"JUILLET"/... —
# ces en-têtes ne sont que des titres de section HTML, sans lien propre,
# 181 publications 2026 constatées sur une seule page au 2026-08-21).
# Chaque publication : `<div class=""><a class="fr-link fr-link--download"
# href="...">` — même famille exacte que 37/41/45/49/52/55/59/62/65/66/69,
# lien PDF direct, pas de `page_detail`.
#
# Signataire confirmé (recherche web, 2026-08-21) : M. Sébastien Jallet,
# préfet de la Sarthe — grammaire au masculin.
type_connecteur: page_web
url_liste: "https://www.sarthe.gouv.fr/Publications/Recueils-des-actes-administratifs"
navigation:
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "RAA-Sarthe-{annee}$"
selecteur_publications: "div[class='']:has(a.fr-link--download)"
selecteur_titre: "a.fr-link--download"
selecteur_lien_pdf: "a.fr-link--download"
autorite_signataire: "Le préfet de la Sarthe"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"

# feature 005 (backfill historique, 2026-09-04) : navigation year-scoped (aucune etape
# ne depend du mois cible), la meme page couvre donc tous les mois d'une meme annee -
# cf. config.schema.ts (granularite_liste) et registre-sources.yaml pour la justification
# structurelle relevee sur ce connecteur.
granularite_liste: annuelle
