# backend/src/connecteurs/configs/prefecture-64.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture des
# Pyrénées-Atlantiques. VALIDÉE PAR CAPTURE LIVE (navigateur Chrome réel)
# le 2026-08-20 (lot 62-66) — cf. claude/etat-connecteurs.md.
#
# Structure confirmée en live sur ".../Publications/Recueil-des-actes-administratifs" :
# navigation à TROIS niveaux — 1. racine → carte de l'année
# ("Annee-{annee}$") ; 2. → carte du mois ("{mois_fr}-{annee}$") ; 3. →
# ÉTAPE OPTIONNELLE inédite dans ce projet : la page du mois est PAGINÉE
# (10 publications par page, triées du PLUS ANCIEN au plus récent — donc
# la page 1 ne contient PAS les publications récentes, à la différence de
# tous les connecteurs précédents) — la publication la plus récente du
# mois est sur la DERNIÈRE page. D'où une 3e étape de navigation ciblant
# `.fr-pagination__link--last` (élément dédié du composant de pagination
# DSFR, présent avec un `href` valide dès la première page tant qu'il y a
# plus d'une page) : elle résout directement l'URL de la dernière page en
# un seul saut, sans avoir à parcourir les pages intermédiaires. Marquée
# `optionnelle: true` car ce lien est absent (ou sans `href`, page
# désactivée) quand le mois tient sur une seule page — dans ce cas l'étape
# est simplement sautée et la page du mois déjà récupérée fait déjà
# référence à toutes les publications.
#
# Sur la page finale (dernière page de pagination, ou page du mois si pas
# de pagination) : chaque publication est une carte DSFR complète
# (`.fr-card`, PAS un simple `<div class="">` comme 37/41/45/49/52/55/59/62/63)
# dont `.fr-card__title a` pointe DIRECTEMENT vers le PDF (pas de page de
# détail HTML intermédiaire, donc pas de `page_detail` malgré la carte
# complète) — `selecteur_publications` est donc le conteneur `.fr-card`
# (avec `selecteur_titre`/`selecteur_lien_pdf` cherchés via `.find()` en son
# sein, comme le tout premier connecteur historique prefecture-13), à
# distinguer du piège `page_detail` documenté pour 58/60 (où la carte ne
# porte PAS le PDF en direct).
type_connecteur: page_web
url_liste: "https://www.pyrenees-atlantiques.gouv.fr/Publications/Recueil-des-actes-administratifs"
navigation:
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "Annee-{annee}$"
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "{mois_fr}-{annee}$"
  - selecteur_liens: ".fr-pagination__link--last"
    pattern_lien: "\\(offset\\)"
    optionnelle: true
selecteur_publications: ".fr-card"
selecteur_titre: ".fr-card__title"
selecteur_lien_pdf: ".fr-card__title a"
autorite_signataire: "Le préfet des Pyrénées-Atlantiques"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"
