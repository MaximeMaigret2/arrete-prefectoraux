# backend/src/connecteurs/configs/prefecture-77.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture de
# Seine-et-Marne (T032). Reprend l'exemple illustratif de
# contracts/connecteur-interface.md (section "Exemple : configuration
# page_web pour prefecture-77"), complété par type_evenement_par_defaut
# (PageWebConfigSchema).
#
# Sélecteurs CSS non vérifiés en conditions réelles contre le HTML actuel
# de seine-et-marne.gouv.fr (pas d'accès web sortant depuis cet
# environnement) — à confirmer/affiner avant la première collecte réelle
# (registre-sources.yaml, notes du département 77 : "structure exacte de
# la page ... à vérifier"). En cas de désaccord avec le HTML réel, le
# connecteur échoue explicitement (echec_global) plutôt que de produire
# un résultat silencieusement faux (contrat §6, règles 2 et 6).
type_connecteur: page_web
url_liste: "https://www.seine-et-marne.gouv.fr/Publications/RAA"
selecteur_publications: ".raa-liste .raa-item"
selecteur_titre: ".raa-item__titre"
selecteur_lien_pdf: ".raa-item__piece-jointe a[href$='.pdf']"
autorite_signataire: "Le Préfet de Seine-et-Marne"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du (?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au (?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté n°\\s*(?<reference>[A-Z0-9-]+)"
