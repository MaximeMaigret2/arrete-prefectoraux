# backend/src/connecteurs/configs/prefecture-2A.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture de la
# Corse-du-Sud. Sélecteurs établis le 2026-08-14 contre une capture réelle
# du site (fetch direct depuis le sandbox cloud).
#
# Structure réelle (cf. fixtures/connecteurs/reel/prefecture-2A/SOURCE.md
# pour le détail complet) :
# - `url_liste` (racine, `point_acces` de registre-sources.yaml) liste DEUX
#   cartes DSFR (`.fr-card__title a`) : le RAA de la Région Corse (hors
#   périmètre, collectivité de Corse) et le RAA de la préfecture de la
#   Corse-du-Sud — NOUVELLE situation parmi les 21 connecteurs précédents
#   (chacun avait jusqu'ici une racine dédiée à son seul département) :
#   désambiguïsée via `pattern_lien: "de-la-prefecture-de-la-Corse-du-Sud$"`
#   (ancré en fin d'URL).
# - Cette page liste à son tour une carte DSFR par ANNÉE (même sélecteur,
#   href se terminant par "-de-l-annee-{annee}") — même famille de structure
#   que prefecture-01/13/18/19/33/77.
# - La page de l'année liste DIRECTEMENT tous les bulletins de l'année au
#   sein d'un groupe de téléchargements DSFR (`div.fr-downloads-group li`),
#   chaque bulletin étant un `<li><a class="fr-link fr-link--download">`
#   portant à la fois le titre ET le lien PDF DIRECT — pas de page de
#   détail intermédiaire, comme prefecture-01/13/17/18/19/33/77 — même
#   idiome que prefecture-19 (racine → année, pas de page mensuelle).
#   PARTICULARITÉ (détectée uniquement en live-drift, pas visible sur un
#   `curl` brut affiché en terminal) : le HTML réel de CET `<a>` est
#   malformé — `<a id= class="fr-link fr-link--download" href="...">`,
#   l'attribut `id` sans valeur (ni guillemets ni espace avant le nom de
#   l'attribut suivant) fait que `htmlparser2`/`cheerio` absorbe `class="…"`
#   dans la valeur de `id` au lieu de le traiter comme un attribut `class`
#   distinct : un sélecteur `a.fr-link--download` ne matche donc JAMAIS
#   contre le DOM réellement parsé, bien que la classe soit visible dans le
#   texte source brut. Comme chaque `<li>` ne contient jamais qu'un seul
#   `<a>` (vérifié : 102/102 sur la page de l'année 2026), `selecteur_titre`/
#   `selecteur_lien_pdf` utilisent simplement `"a"` (n'importe quel lien du
#   `<li>`) plutôt qu'un sélecteur de classe — contournement générique, pas
#   une nouvelle capacité moteur.
# - Navigation à 2 niveaux au total (racine → recueil-préfecture → année) :
#   AUCUNE extension moteur nécessaire, le moteur boucle déjà sur un nombre
#   arbitraire d'étapes de `navigation`.
# - Page NON paginée (103 bulletins de l'année 2026 au moment de la
#   capture, tous sur une seule page HTML) : comme la majorité des
#   connecteurs déployés, aucune étape de pagination nécessaire.
#
# Comme les autres connecteurs déployés : le nom du bulletin ("Télécharger
# recueil-2a-2026-NNN-recueil-des-actes-administratifs...") ne mentionne
# jamais son contenu réglementaire — c'est le moteur `page_web` (scan de
# contenu PDF) qui retente la pertinence sur le texte du PDF avant
# d'abandonner un candidat.
#
# Référence d'arrêté réelle vérifiée au format "2A-AAAA-MM-JJ-NNNNN" (ex.
# "Arrêté n°2A-2026-08-14-00002", relevé sur plusieurs vrais PDF) : couverte
# par `pattern_reference` existant. Signataire réel relevé sur plusieurs
# vrais PDF : "Le préfet de Corse, préfet de la Corse-du-Sud" (poste combiné
# régional/départemental propre à la Corse).
#
# Formulation exacte du texte réglementaire d'un arrêté anti rave-party à
# l'intérieur d'un vrai PDF NON vérifiée (aucun bulletin réel disponible au
# moment de la capture, même limite que les 21 connecteurs précédents) —
# `patterns_dates` reprend l'hypothèse déjà posée ailleurs — à confirmer
# avant collecte réelle.
type_connecteur: page_web
url_liste: "https://www.corse-du-sud.gouv.fr/Publications/Recueil-des-actes-administratifs"
navigation:
  # Racine → carte "Recueil des actes administratifs de la préfecture de la
  # Corse-du-Sud" (par opposition à la carte "Région Corse", hors périmètre).
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "de-la-prefecture-de-la-Corse-du-Sud$"
  # Page "Recueil de la préfecture..." → carte de l'année courante (href se
  # termine par "annee-{annee}").
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "annee-{annee}$"
selecteur_publications: "div.fr-downloads-group li"
# Même lien porte le titre ET l'URL du PDF (comme prefecture-01/13/18/19/33/77).
# "a" (pas "a.fr-link--download") : voir la note ci-dessus sur le HTML
# malformé qui empêche tout sélecteur de classe de matcher cet élément.
selecteur_titre: "a"
selecteur_lien_pdf: "a"
autorite_signataire: "Le préfet de Corse, préfet de la Corse-du-Sud"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"

# feature 005 (backfill historique, 2026-09-04) : navigation year-scoped (aucune etape
# ne depend du mois cible), la meme page couvre donc tous les mois d'une meme annee -
# cf. config.schema.ts (granularite_liste) et registre-sources.yaml pour la justification
# structurelle relevee sur ce connecteur.
granularite_liste: annuelle
