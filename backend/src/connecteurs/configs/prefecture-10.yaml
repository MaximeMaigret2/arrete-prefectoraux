# backend/src/connecteurs/configs/prefecture-10.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture de l'Aube.
# Sélecteurs établis le 2026-08-14 (Phase 5bis élargie 2) contre une capture
# réelle du site (fetch direct depuis le sandbox cloud).
#
# `point_acces` corrigé par rapport au registre des sources initial
# (identifié le 2026-08-13 par recherche web) : l'URL alors enregistrée
# (".../Publications/RAA-Recueil-des-Actes-Administratifs") redirige
# aujourd'hui (redirection serveur, suivie nativement par `fetch`) vers
# ".../Publications/Recueil-des-Actes-Administratifs-RAA2" — c'est cette
# URL réelle (confirmée par `curl -L`, code HTTP 200 après redirection) qui
# est utilisée ci-dessous comme `url_liste`, même situation que
# prefecture-04 en Phase 5bis élargie (point_acces corrigé lors de
# l'implémentation, cf. registre-sources.yaml).
#
# Structure réelle : `url_liste` RACINE liste une carte par année
# (`.fr-card`, href se terminant par "-2026") ; la page de l'année est
# DÉJÀ la liste finale, en PLATE (chaque bulletin — "RAA n°194 du 13 août
# 2026" — est une carte `.fr-card` dont le titre EST le nom du fichier PDF
# et dont `.fr-card__title a` porte directement le lien PDF, pas de
# découpage par mois), PAGINÉE (10 par page) mais en ordre DÉCROISSANT (le
# bulletin le plus récent en tête de la page 1, confirmé par les dates
# décroissantes 13→12→11→10→7→7 août sur cette seule page) — comme
# prefecture-06/08/09, aucune étape supplémentaire vers la "dernière page"
# n'est nécessaire ici (contrairement à prefecture-02/05). Un seul niveau
# de `navigation` suffit donc, le plus simple des 5 connecteurs de cette
# session avec prefecture-08.
#
# Comme les autres connecteurs déployés : le nom du bulletin ne mentionne
# jamais son contenu réglementaire — c'est le moteur `page_web` (scan de
# contenu PDF) qui retente la pertinence sur le texte du PDF avant
# d'abandonner un candidat.
#
# Formulation exacte du texte réglementaire à l'intérieur d'un vrai PDF NON
# vérifiée (même limite que les connecteurs précédents) —
# `patterns_dates`/`pattern_reference` reprennent l'hypothèse déjà posée
# ailleurs — à confirmer avant collecte réelle.
type_connecteur: page_web
url_liste: "https://www.aube.gouv.fr/Publications/Recueil-des-Actes-Administratifs-RAA2"
navigation:
  # Racine → carte de l'année courante, déjà la liste complète et plate
  # (href se termine par "-2026").
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "-{annee}$"
selecteur_publications: ".fr-card"
# Même lien porte le titre ET l'URL du PDF (comme prefecture-01/06/13).
selecteur_titre: ".fr-card__title a"
selecteur_lien_pdf: ".fr-card__title a"
autorite_signataire: "Le Préfet de l'Aube"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"
