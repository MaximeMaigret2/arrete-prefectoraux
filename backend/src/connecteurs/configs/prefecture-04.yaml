# backend/src/connecteurs/configs/prefecture-04.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture des
# Alpes-de-Haute-Provence. Sélecteurs établis le 2026-08-14 (Phase 5bis
# élargie) contre une capture réelle du site (inspection Chrome, DOM déjà
# rendu).
#
# Structure réelle, unique parmi les 5 connecteurs de cette session :
# `url_liste` est une page RACINE listant une carte par SEMESTRE
# IRRÉGULIER (pas par année ni par mois) — "2026 de janvier à juillet" (7
# mois) et "2026 de août à décembre" (5 mois), découpage inégal qui varie
# aussi d'une année à l'autre pour les années plus anciennes (ex. trimestres
# en 2017-2019). Le nom du mois courant n'apparaît dans l'URL que pour les 4
# mois de bornes (janvier/juillet/août/décembre) — insuffisant pour un
# `pattern_lien` simple à base de `{mois_fr}`. D'où la forme `periodes`
# (V009, contracts/connecteur-interface.md §2ter) : le moteur choisit le
# motif dont la plage `[mois_debut, mois_fin]` contient le mois courant.
#
# La page de semestre est déjà la liste complète, en PLATE, ordre
# chronologique DÉCROISSANT (le plus récent bulletin en tête) — pas de
# pagination ni de niveau de navigation supplémentaire. Chaque bulletin
# ("RS 04-2026-227", "RS Nominatif 04-2026-226"...) est rendu dans une
# structure `<table><tr><td><div><a class="fr-link--download">`
# (accessible via `.fr-table td > div`, 11 correspondances exactes pour les
# 11 bulletins du semestre au moment de la capture) — contrairement aux
# autres départements, cette page affiche AUSSI le sommaire détaillé de
# chaque arrêté contenu dans le bulletin (sujet, date, service signataire),
# mais ce texte n'est pas exploité ici : comme pour prefecture-01/03/13/33,
# le nom du bulletin téléchargeable ne mentionne jamais son contenu, donc
# c'est le scan de contenu PDF (générique, moteur `page_web`) qui détermine
# la pertinence, exactement comme pour les autres connecteurs de cette
# session — traitement uniforme plutôt que d'exploiter un texte HTML
# disponible ici mais absent ailleurs (contrat §5, règle 7 : pas de
# comportement spécifique à un connecteur).
#
# Formulation exacte du texte réglementaire à l'intérieur d'un vrai PDF NON
# vérifiée (même limite que les 4 autres connecteurs de cette session) —
# `patterns_dates`/`pattern_reference` reprennent l'hypothèse déjà posée
# ailleurs — à confirmer avant collecte réelle.
type_connecteur: page_web
url_liste: "https://www.alpes-de-haute-provence.gouv.fr/Publications/Publications-administratives-et-legales/Recueil-des-Actes-Administratifs"
navigation:
  # Racine → carte du semestre courant (janvier-juillet ou août-décembre).
  - selecteur_liens: ".fr-card__title a"
    periodes:
      - motif: "/{annee}-de-janvier-a-juillet$"
        mois_debut: 1
        mois_fin: 7
      - motif: "/{annee}-de-aout-a-decembre$"
        mois_debut: 8
        mois_fin: 12
selecteur_publications: ".fr-table td > div"
# Même lien porte le titre ET l'URL du PDF (comme prefecture-13).
selecteur_titre: "a.fr-link--download"
selecteur_lien_pdf: "a.fr-link--download"
autorite_signataire: "Le Préfet des Alpes-de-Haute-Provence"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"
