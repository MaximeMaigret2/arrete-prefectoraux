# backend/src/connecteurs/configs/prefecture-41.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture de
# Loir-et-Cher. VALIDÉE PAR CAPTURE LIVE (navigateur Chrome réel) le
# 2026-08-18 — cf. claude/etat-connecteurs.md pour le contexte (WebFetch
# bloqué sur tous les sous-chemins de ce domaine dans le sandbox cloud ;
# validation faite via navigation Chrome réelle côté utilisateur).
#
# Seul connecteur du lot avec un DEUXIÈME niveau de navigation, confirmé :
# racine → carte "Année 2026" → carte du mois (12 cartes .fr-card__title a
# sur la page année, une par mois). Format du segment mois confirmé en
# direct sur la page 2026 : nom du mois français, capitale initiale, SANS
# accent ("Aout", "Fevrier"...), conforme au placeholder existant
# `{mois_fr}` (mêmes valeurs que `NOMS_MOIS_FR`, déjà utilisé par
# prefecture-01/33/36).
#
# PIÈGE CONFIRMÉ EN LIVE : le suffixe "-{annee}" sur le segment mois n'est
# PAS constant selon l'année. Vérifié sur le site réel :
#   - Annee-2026 (année courante) : ".../Annee-2026/Aout" (SANS suffixe)
#   - Annee-2020 (archive)        : ".../Annee-2020/Aout-2020" (AVEC suffixe)
# Le motif "{mois_fr}(-{annee})?$" couvre les deux formats (le groupe
# "-{annee}" est rendu optionnel) — nécessaire car ce connecteur doit
# rester valide au changement d'année, où le format "sans suffixe" du
# mois courant deviendra vraisemblablement "avec suffixe" une fois l'année
# archivée (par analogie avec 2020-2025, toutes avec suffixe).
#
# `selecteur_publications`/`selecteur_titre`/`selecteur_lien_pdf` liste
# plate `div[class='']:has(a.fr-link--download)` — CONFIRMÉE EN LIVE sur la
# page ".../Annee-2026/Aout" : 13 correspondances qualifiées vs 17 pour le
# sélecteur non qualifié `div:has(...)` (bug de sur-correspondance des
# ancêtres `:has()` documenté pour prefecture-37 — la qualification reste
# nécessaire ici aussi).
#
# `autorite_signataire` confirmée (décret de nomination du 23 juillet 2025,
# Légifrance) : M. Joseph Zimet.
type_connecteur: page_web
url_liste: "https://www.loir-et-cher.gouv.fr/Publications/Recueil-des-actes-administratifs"
navigation:
  # Racine → carte de l'année courante (confirmée en live : ".../Annee-2026").
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "-{annee}$"
  # Page de l'année → carte du mois courant. Suffixe "-{annee}" optionnel :
  # confirmé absent pour l'année courante (2026) mais présent pour les
  # archives (ex. 2020) — cf. piège documenté ci-dessus.
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "/{mois_fr}(-{annee})?$"
selecteur_publications: "div[class='']:has(a.fr-link--download)"
selecteur_titre: "a.fr-link--download"
selecteur_lien_pdf: "a.fr-link--download"
autorite_signataire: "Le préfet de Loir-et-Cher"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"
