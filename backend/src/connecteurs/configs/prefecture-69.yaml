# backend/src/connecteurs/configs/prefecture-69.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture du Rhône.
# VALIDÉE PAR CAPTURE LIVE (navigateur Chrome réel) le 2026-08-21 (lot
# 67-71) — cf. claude/etat-connecteurs.md.
#
# Structure confirmée en live sur
# ".../Publications/Recueil-des-actes-administratifs-du-Rhone-RAA" :
# navigation à DEUX niveaux — racine → carte de l'année (motif
# "Recueils-de-{annee}$") → carte du mois. Liste finale (mois courant) :
# liste PLATE sans pagination (20 publications en août 2026 au
# 2026-08-21), chaque publication dans un `div[class='']` contenant un
# unique `a.fr-link--download` — même famille exacte que
# 37/41/45/49/52/55/59/62/65/66.
#
# PARTICULARITÉ du motif de l'étape mois : le slug du site alterne entre
# "Recueils-de-{mois}" (janvier, février, mars, mai, juin, juillet,
# septembre, octobre, novembre, décembre — mois commençant par une
# consonne) et "Recueils-d-{mois}" (avril, août — élision "d'avril"/"d'août"
# devant voyelle, vérifiée en live pour ces deux mois). D'où le motif
# `"Recueils-d(e)?-{mois_fr_minuscule}$"`, qui couvre les deux formes sans
# dépendre du mois courant — vérifié qu'il matche bien "Recueils-d-aout"
# (mois courant, 2026-08-21) ET la forme "Recueils-de-mars"/"Recueils-de-juin"
# observées sur les autres mois de la même page.
type_connecteur: page_web
url_liste: "https://www.rhone.gouv.fr/Publications/Recueil-des-actes-administratifs-du-Rhone-RAA"
navigation:
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "Recueils-de-{annee}$"
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "Recueils-d(e)?-{mois_fr_minuscule}$"
selecteur_publications: "div[class='']:has(a.fr-link--download)"
selecteur_titre: "a.fr-link--download"
selecteur_lien_pdf: "a.fr-link--download"
autorite_signataire: "Le préfet du Rhône"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"
