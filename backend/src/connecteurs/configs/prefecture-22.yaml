# backend/src/connecteurs/configs/prefecture-22.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture des
# Côtes-d'Armor. Sélecteurs établis le 2026-08-14 contre une capture réelle
# du site (fetch direct depuis le sandbox cloud).
#
# Structure réelle (cf. fixtures/connecteurs/reel/prefecture-22/SOURCE.md
# pour le détail complet) :
# - `url_liste` (racine) liste DIRECTEMENT une carte DSFR par MOIS × ANNÉE
#   (`.fr-card__title a`, href de la forme `/AOUT-2026`, `/AVRIL-2026`,
#   etc., en MAJUSCULES et SANS accent) — PAS de carte année intermédiaire,
#   contrairement à prefecture-01/06/09/18/24 : navigation à UN SEUL niveau
#   (racine → mois), le motif `pattern_lien: "{mois_fr}-{annee}$"` matche
#   `AOUT-2026` grâce au flag `i` (compilation insensible à la casse),
#   malgré la casse différente de `{mois_fr}` ("Aout").
# - La page du mois liste chaque bulletin comme une carte DSFR complète
#   (`div.fr-card`, comme prefecture-17), avec le lien PDF DIRECT porté par
#   `h2.fr-card__title a` (`class="fr-card__link menu-item-link"`) — pas de
#   page de détail intermédiaire.
# - Page PAGINÉE (10 bulletins/page, `fr-pagination` présent avec un lien
#   "Suivant" vers `/AOUT-2026/(offset)/10`) mais AUCUNE étape de
#   pagination nécessaire : contrairement à prefecture-02/05 (qui sautent
#   vers la DERNIÈRE page pour atteindre les entrées les plus récentes),
#   l'ordre ici est DÉCROISSANT (le plus récent en tête, comme prefecture-
#   01/03/13/17/18/33/21) — la page 1 (celle atteinte par `url_liste` +
#   `navigation`, sans étape de pagination) contient donc déjà les
#   publications les plus récentes (vérifié : le 14/08/2026, jour de la
#   capture, y est représenté). Le moteur ne visite jamais que la première
#   page résolue par `navigation` — suffisant ici, contrairement aux sites
#   à ordre croissant où la pagination est nécessaire pour atteindre le
#   présent.
#
# Signataire réel confirmé sur 1 vrai PDF téléchargé (49 pages) : « Le
# Préfet des Côtes-d'Armor » (masculine, comme la majorité des connecteurs
# précédents) — confirmé aussi par le logo textuel de chaque carte
# (« préfet des Côtes-d'Armor »).
#
# Formulation exacte du texte réglementaire à l'intérieur d'un vrai PDF NON
# vérifiée (aucun arrêté anti rave-party réel trouvé dans l'échantillon
# téléchargé) — `patterns_dates`/`pattern_reference` reprennent l'hypothèse
# générique déjà posée pour la plupart des connecteurs précédents.
type_connecteur: page_web
url_liste: "https://www.cotes-darmor.gouv.fr/Publications/Recueil-des-actes-administratifs"
navigation:
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "{mois_fr}-{annee}$"
selecteur_publications: "div.fr-card"
selecteur_titre: "h2.fr-card__title a"
selecteur_lien_pdf: "h2.fr-card__title a"
autorite_signataire: "Le Préfet des Côtes-d'Armor"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"
