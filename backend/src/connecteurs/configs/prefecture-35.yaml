# backend/src/connecteurs/configs/prefecture-35.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture
# d'Ille-et-Vilaine. Sélecteurs établis le 2026-08-14 (lot 31-36) contre une
# capture réelle du site (fetch direct depuis le sandbox cloud).
#
# Structure réelle (cf. fixtures/connecteurs/reel/prefecture-35/SOURCE.md
# pour le détail complet) :
# - `url_liste` (racine) liste 3 cartes DSFR (`.fr-card__title a`) : «
#   Recueil des actes administratifs 2025 » (URL avec coquille `-20252`,
#   sans incidence pour la substitution `{annee}` qui vise l'année
#   courante), « Archives... » et « Recueil des actes administratifs 2026 »
#   (href se terminant proprement par `-2026`). `pattern_lien:
#   "-administratifs-{annee}$"` cible sans ambiguïté la carte de l'année
#   courante.
# - La page de l'année liste DIRECTEMENT tous les bulletins de l'année (231
#   liens `a.fr-link--download` au moment de la capture), chaque bulletin
#   étant un `<div class="">` contenant un unique
#   `<a class="fr-link fr-link--download">` avec un titre INFORMATIF (ex.
#   "Télécharger RAA-35-2026-240 du 14 août 2026") + lien PDF DIRECT — pas
#   de page de détail.
# - Piège `:has()` par remontée d'ancêtres (même famille que
#   23/25/26/28/29/30/32/34) : `div:has(a.fr-link--download)` matche 234
#   correspondances contre la page réelle, pour seulement 231 liens réels.
#   `selecteur_publications` qualifié en `div[class='']:has(a.fr-link--download)`
#   dès la conception de ce connecteur (231/231 exact).
# - Page NON paginée (231 bulletins de 2026 au moment de la capture, tous
#   sur une seule page HTML).
# - Bulletin le plus récent au moment de la capture : RAA-35-2026-240 du 14
#   août 2026 — le jour même du déploiement de ce connecteur, la même
#   semaine que les arrêtés anti rave-party réels confirmés en Creuse (23)
#   et dans le Doubs (25).
#
# Signataire réel : préfète actuelle d'Ille-et-Vilaine confirmée par décret
# de nomination (Légifrance, 24 juin 2026) : Mme Emmanuelle DUBÉE (féminin)
# — `autorite_signataire` = « La préfète d'Ille-et-Vilaine ». Non confirmé
# par un vrai PDF (téléchargement bloqué, cf. ci-dessous).
#
# LIMITE DE CAPTURE : comme la majorité des connecteurs du lot 26-30, le
# endpoint `/contenu/telechargement/...` de ce site refuse systématiquement
# les téléchargements automatisés depuis le sandbox cloud de cette session
# (HTTP 503 immédiat) — aucun vrai PDF n'a pu être échantillonné, malgré un
# bulletin très récent (RAA-35-2026-240 du 14/08/2026) dont le titre seul
# ne permet pas de préjuger du contenu. `bulletin-avec-arrete.pdf`/
# `bulletin-sans-arrete-pertinent.pdf` sont donc synthétiques (`reportlab`) ;
# `patterns_dates`/`pattern_reference` reprennent l'hypothèse générique déjà
# posée pour la plupart des connecteurs précédents.
type_connecteur: page_web
url_liste: "https://www.ille-et-vilaine.gouv.fr/Publications/Recueil-des-actes-administratifs"
navigation:
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "-administratifs-{annee}$"
selecteur_publications: "div[class='']:has(a.fr-link--download)"
selecteur_titre: "a.fr-link--download"
selecteur_lien_pdf: "a.fr-link--download"
autorite_signataire: "La préfète d'Ille-et-Vilaine"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"

# feature 005 (backfill historique, 2026-09-04) : navigation year-scoped (aucune etape
# ne depend du mois cible), la meme page couvre donc tous les mois d'une meme annee -
# cf. config.schema.ts (granularite_liste) et registre-sources.yaml pour la justification
# structurelle relevee sur ce connecteur.
granularite_liste: annuelle
