# backend/src/connecteurs/configs/prefecture-32.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture du Gers.
# Sélecteurs établis le 2026-08-14 (lot 31-36) contre une capture réelle du
# site (fetch direct depuis le sandbox cloud).
#
# Structure réelle (cf. fixtures/connecteurs/reel/prefecture-32/SOURCE.md
# pour le détail complet) :
# - `url_liste` (racine) liste une carte DSFR par ANNÉE (`.fr-card__title
#   a`, href se terminant par `edites-en-{annee}`, ex.
#   `Recueils-des-actes-administratifs-edites-en-2026`).
# - La page de l'année liste DIRECTEMENT tous les bulletins de l'année (199
#   au moment de la capture) — PARTICULARITÉ NOUVELLE parmi les 33
#   connecteurs déployés jusque-là : un VRAI `<table>` HTML (« Numéro / Date
#   de publication / Lien de téléchargement »), pas une carte DSFR ni une
#   simple liste `<div>`/`<li>`. Chaque ligne (`<tr>`) porte le numéro et la
#   date en texte brut dans les 2 premières `<td>`, et le lien PDF DIRECT
#   dans la 3e `<td>`, lui-même enveloppé dans un `<div class="">` — même
#   famille `div[class=""]:has(a.fr-link--download)` que 23/25/26/28/29/30
#   pour le piège `:has()` par remontée d'ancêtres (vérifié 205
#   correspondances contre la page réelle, pour seulement 199 liens réels —
#   qualifié dès la conception de ce connecteur, jamais déployé avec le
#   sélecteur non qualifié).
# - Le texte du lien lui-même ("Télécharger le document") ne porte AUCUNE
#   information de contenu — `selecteur_titre`/`selecteur_lien_pdf` restent
#   `a.fr-link--download` par cohérence avec les autres connecteurs de la
#   même famille, mais le titre extrait ("Télécharger le document...") ne
#   sert jamais à la pertinence en pratique : seul le texte du PDF joint
#   peut réellement la déterminer sur ce site (comme prefecture-27/33).
# - Page NON paginée (199 bulletins de 2026 au moment de la capture, tous
#   sur un seul `<table>` HTML).
#
# Signataire réel : préfet actuel du Gers confirmé par recherche web
# (nomination antérieure, poste toujours occupé au 2026-08-14) : M. Alain
# CASTANIER (masculin) — `autorite_signataire` = « Le préfet du Gers ».
# Non confirmé par un vrai PDF (téléchargement bloqué, cf. ci-dessous).
#
# LIMITE DE CAPTURE : comme la majorité des connecteurs du lot 26-30, le
# endpoint `/contenu/telechargement/...` de ce site refuse systématiquement
# les téléchargements automatisés depuis le sandbox cloud de cette session
# (HTTP 503 immédiat) — aucun vrai PDF n'a pu être échantillonné.
# `bulletin-avec-arrete.pdf`/`bulletin-sans-arrete-pertinent.pdf` sont donc
# synthétiques (`reportlab`) ; `patterns_dates`/`pattern_reference`
# reprennent l'hypothèse générique déjà posée pour la plupart des
# connecteurs précédents.
type_connecteur: page_web
url_liste: "https://www.gers.gouv.fr/Publications/Recueil-des-Actes-Administratifs-RAA"
navigation:
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "edites-en-{annee}$"
selecteur_publications: "div[class='']:has(a.fr-link--download)"
selecteur_titre: "a.fr-link--download"
selecteur_lien_pdf: "a.fr-link--download"
autorite_signataire: "Le préfet du Gers"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"
