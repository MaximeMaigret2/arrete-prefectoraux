# backend/src/connecteurs/configs/prefecture-66.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture des
# Pyrénées-Orientales. VALIDÉE PAR CAPTURE LIVE (navigateur Chrome réel)
# le 2026-08-20 (lot 62-66) — cf. claude/etat-connecteurs.md.
#
# Structure confirmée en live sur ".../Publications/Le-recueil-des-actes-administratifs" :
# navigation à UN niveau (racine → carte de l'année) vers une page listant
# TOUS les numéros de l'année SANS pagination (197 publications sur une
# seule page au 2026-08-20) — pas de page_detail, liste plate, chaque
# publication dans un `<div class="">` contenant un unique
# `a.fr-link--download` — même famille exacte que
# prefecture-37/41/45/49/52/55/59/62/65.
#
# PARTICULARITÉ DE MARKUP (racine uniquement) : PAS de carte DSFR
# (`.fr-card`) pour les liens d'année sur ce site — chaque année est un
# simple `<h3><a class="fr-link">Année {annee}</a></h3>` sans conteneur
# `.fr-card`. `selecteur_liens: "h3 a"` cible précisément les 23 liens
# d'année (vérifié en live : `main h3` = 23 éléments = 23 années listées,
# aucun autre `h3` sur la page). PIÈGE ÉCARTÉ : la page contient aussi un
# lien de menu latéral factice "[TEST] RAA" → "/Publications/TEST-RAA/..."
# (élément `<li class="fr-sidemenu__item">`, hors `h3`) — `selecteur_liens:
# "h3 a"` l'exclut naturellement puisqu'il n'est jamais dans un `<h3>`.
type_connecteur: page_web
url_liste: "https://www.pyrenees-orientales.gouv.fr/Publications/Le-recueil-des-actes-administratifs"
navigation:
  - selecteur_liens: "h3 a"
    pattern_lien: "Annee-{annee}$"
selecteur_publications: "div[class='']:has(a.fr-link--download)"
selecteur_titre: "a.fr-link--download"
selecteur_lien_pdf: "a.fr-link--download"
autorite_signataire: "Le préfet des Pyrénées-Orientales"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"

# feature 005 (backfill historique, 2026-09-04) : navigation year-scoped (aucune etape
# ne depend du mois cible), la meme page couvre donc tous les mois d'une meme annee -
# cf. config.schema.ts (granularite_liste) et registre-sources.yaml pour la justification
# structurelle relevee sur ce connecteur.
granularite_liste: annuelle
