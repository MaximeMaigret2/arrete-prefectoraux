# backend/src/connecteurs/configs/prefecture-36.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture de l'Indre.
# Sélecteurs établis le 2026-08-14 (lot 31-36) contre une capture réelle du
# site (fetch direct depuis le sandbox cloud).
#
# Structure réelle (cf. fixtures/connecteurs/reel/prefecture-36/SOURCE.md
# pour le détail complet) :
# - `url_liste` (racine) liste une carte DSFR par ANNÉE (`.fr-card__title
#   a`, href se terminant par `{annee}`, ex. `.../2026`) + une carte «
#   Archives » sans rapport. `pattern_lien: "{annee}$"` cible sans
#   ambiguïté l'année courante.
# - La page de l'année liste une carte DSFR par MOIS, préfixée d'un numéro
#   à 2 chiffres (`.fr-card__title a`, ex. « 08. Aout 2026 » → href
#   `.../08.-Aout-2026`) — PARTICULARITÉ : les mois FUTURS (non encore
#   publiés au moment de la capture, ex. « 09. Septembre ») n'ont PAS le
#   suffixe `-{annee}` dans leur URL, contrairement aux mois déjà publiés —
#   sans incidence pour ce connecteur puisque `pattern_lien:
#   "{mois_numero}\\.-{mois_fr}-{annee}$"` cible toujours le MOIS COURANT,
#   qui a nécessairement déjà des bulletins publiés (et donc le suffixe
#   année) au moment où le connecteur tourne.
# - La page du mois est une VRAIE carte DSFR par bulletin (`.fr-card`,
#   comme prefecture-31/Haute-Garonne — lien PDF direct porté par
#   `.fr-card__title a`, classe `fr-card__link menu-item-link` plutôt que
#   `fr-link fr-link--download`), PAGINÉE (`fr-pagination`, 10 bulletins
#   par page) MAIS en ordre chronologique **CROISSANT** (le plus ancien en
#   tête) — À LA DIFFÉRENCE DE prefecture-31, dont l'ordre est décroissant.
#   Conséquence directe : les bulletins les PLUS RÉCENTS du mois courant
#   sont donc sur la DERNIÈRE page, jamais la première — vérifié le
#   14/08/2026 (page 1 : bulletins n°212 à 221, du 01/08 au 09/08 ; page 2
#   = dernière page : bulletins n°222 à 228, du 10/08 au 14/08 inclus,
#   plusieurs bulletins spéciaux publiés le jour même).
# - Troisième étape de `navigation` (NOUVELLE UTILISATION de `optionnelle`
#   V010, jusqu'ici seulement pour une pagination ABSENTE — ici pour
#   atteindre délibérément la DERNIÈRE page plutôt que la première) :
#   `selecteur_liens: ".fr-pagination__link--last"`, `pattern_lien: ".+"`
#   (motif volontairement permissif — le sélecteur de classe cible déjà
#   sans ambiguïté LE lien « Dernière page », son `href` variant selon
#   l'offset). `optionnelle: true` : ce lien est ABSENT du DOM quand le
#   mois courant tient déjà sur une seule page (≤ 10 bulletins, notamment
#   en tout début de mois) — l'étape est alors simplement sautée, la page 1
#   (déjà la dernière) restant la page courante.
#
# Signataire réel : préfète actuelle de l'Indre confirmée par décret de
# nomination (Légifrance, 8 avril 2026) : Mme Maryvonne LE BRIGNONEN
# (féminin) — `autorite_signataire` = « La préfète de l'Indre ». Non
# confirmé par un vrai PDF (téléchargement bloqué, cf. ci-dessous).
#
# LIMITE DE CAPTURE : comme la majorité des connecteurs du lot 26-30, le
# endpoint `/contenu/telechargement/...` de ce site refuse systématiquement
# les téléchargements automatisés depuis le sandbox cloud de cette session
# (HTTP 503 immédiat) — aucun vrai PDF n'a pu être échantillonné, malgré
# plusieurs bulletins spéciaux publiés le 14 août 2026 même (le jour du
# déploiement de ce connecteur, la même semaine que les arrêtés anti
# rave-party réels confirmés en Creuse (23) et dans le Doubs (25)) dont le
# titre seul ne permet pas de préjuger du contenu.
# `bulletin-avec-arrete.pdf`/`bulletin-sans-arrete-pertinent.pdf` sont donc
# synthétiques (`reportlab`) ; `patterns_dates`/`pattern_reference`
# reprennent l'hypothèse générique déjà posée pour la plupart des
# connecteurs précédents.
type_connecteur: page_web
url_liste: "https://www.indre.gouv.fr/Publications/Recueil-des-actes-administratifs"
navigation:
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "{annee}$"
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "{mois_numero}\\.-{mois_fr}-{annee}$"
  - selecteur_liens: ".fr-pagination__link--last"
    pattern_lien: ".+"
    optionnelle: true
selecteur_publications: ".fr-card"
selecteur_titre: ".fr-card__title a"
selecteur_lien_pdf: ".fr-card__title a"
autorite_signataire: "La préfète de l'Indre"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"
