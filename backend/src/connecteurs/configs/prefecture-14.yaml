# backend/src/connecteurs/configs/prefecture-14.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture du Calvados.
# Sélecteurs établis le 2026-08-14 (Phase 5bis élargie 3) contre une capture
# réelle du site (fetch direct depuis le sandbox cloud).
#
# Structure réelle, particulière parmi les 5 : `url_liste` RACINE ne liste
# que DEUX cartes — "Recueil des actes administratifs départemental" et
# "...régional" (href se terminant respectivement par "-departemental" et
# "-regional") — les arrêtés d'interdiction relevant du niveau départemental,
# cette 1ère étape de `navigation` utilise un `pattern_lien` LITTÉRAL fixe
# ("-departemental$", jamais un placeholder de date) pour choisir la bonne
# branche — même situation que prefecture-09 (segment d'URL fixe qui ne
# varie jamais avec la date de collecte).
#
# La page "départemental" liste ensuite une carte par ANNÉE (href se
# terminant par "/2026", sans préfixe "Annee-" contrairement aux autres
# connecteurs) — 2e étape de `navigation`, `pattern_lien: "/{annee}$"`.
#
# La page de l'année est DÉJÀ la liste finale, en PLATE (`.fr-downloads-group
# li`, 323 bulletins pour 2026 au moment de la capture, pas de découpage par
# mois, ordre chronologique CROISSANT mais tous sur une seule page, non
# paginée malgré le volume). Piège identique à prefecture-05/07/08/09/11/12 :
# TOUS les liens de téléchargement portent le bug de markup `<a id=
# class="fr-link fr-link--download">` — `selecteur_titre`/`selecteur_lien_pdf`
# ciblent donc directement `a[href$='.pdf']`.
#
# Nom de fichier ("recueil-14-2026-342-recueil-des-actes-administratifs")
# reprenant directement une numérotation séquentielle globale exploitable
# ("14-2026-{num}") — utilisée pour choisir un numéro de référence réaliste
# dans les PDF synthétiques de cette fixture.
#
# Comme les autres connecteurs déployés : le nom du bulletin ne mentionne
# jamais son contenu réglementaire — c'est le moteur `page_web` (scan de
# contenu PDF) qui retente la pertinence sur le texte du PDF avant
# d'abandonner un candidat.
#
# CORRECTIF (2026-09-19, exploitation manuelle de ~2350 PDF réels
# téléchargés localement, feature hors-app) : `patterns_dates`/
# `pattern_reference`/`mots_cles_filtrage` ci-dessous avaient été posés par
# hypothèse (cf. version précédente de ce commentaire, "NON vérifiée") et se
# sont révélés faux sur pièces. Constats, contre 2350 bulletins réels
# (2018-2026) et 38 arrêtés d'interdiction "rassemblements festifs"
# confirmés à l'œil :
#
# 1. Chaque bulletin "recueil-...-special.pdf" est un RAA compilé (des
#    dizaines d'actes de nature variée dans un même PDF, jusqu'à 300+
#    pages) — le moteur `pdf` (`telechargerEtExtraireTextePdf`) en extrait
#    le texte COMPLET, concaténé, comme `texte` unique du candidat : tout
#    `pattern_reference`/`patterns_dates` s'applique donc au bulletin
#    entier, pas au seul arrêté pertinent. `pattern_reference` ci-dessous
#    ancre donc désormais sa capture sur le voisinage immédiat de la
#    locution "interdiction des rassemblements festifs" pour éviter de
#    capturer la référence d'un acte sans rapport apparaissant plus tôt
#    dans le même bulletin.
#
# 2. Les arrêtés d'interdiction eux-mêmes sont des PAGES SCANNÉES (image,
#    sans couche de texte) dans la quasi-totalité des bulletins observés —
#    seule la ligne de pied de page générée automatiquement par le RAA
#    ("Préfecture du Calvados - <id_publication> - <titre>") porte du texte
#    extractible par `pdf-parse`/`pdftotext` sur ces pages. Pour les
#    bulletins les plus récents (constaté à partir de janv. 2026), la page
#    de couverture de l'arrêté (titre seul, avant les visas/considérants)
#    est en revanche nativement numérique et donc extractible en entier —
#    mais PAS le corps de l'acte (visas, considérants, articles), toujours
#    scanné. Conséquence directe : la date d'effet réelle (Art. 5,
#    formulée "applicables du <jour> <date> à <heure> au <jour> <date> à
#    <heure>") n'est EXTRACTIBLE PAR AUCUN MOYEN actuel de l'app (FR-005,
#    jamais d'OCR) — `patterns_dates` ci-dessous est corrigé pour refléter
#    la formulation réelle (elle ne matchait STRICTEMENT AUCUN document,
#    l'ancienne version cherchait un format numérique "JJ/MM/AAAA" qui
#    n'existe nulle part dans ces arrêtés), mais restera structurellement
#    sans effet tant que ces pages resteront des scans : un candidat
#    "rassemblements festifs" continuera de remonter en anomalie
#    `champ_manquant` (date_debut manquante) plutôt que d'être publié
#    automatiquement — c'est le comportement correct et volontaire du
#    contrat (FR-008) face à une donnée réellement illisible, pas un bug
#    restant à corriger côté connecteur.
#
# 3. `mots_cles_filtrage` ne matchait non plus AUCUN bulletin réel : "rave"
#    et "teknival" n'apparaissent que dans le corps scanné (page de
#    couverture 2024-2025) ou, pour les bulletins récents, dans le titre
#    numérique de couverture ("free-party, rave-party, teknival") — mais
#    "rassemblement musical non déclaré" (singulier) n'est la sous-chaîne
#    d'aucune formulation réelle observée (toujours "rassemblements
#    festifs à caractère musical [...] non déclarés", pluriel, avec
#    "festifs à caractère" intercalé). Ajout de "rassemblements festifs",
#    seule sous-chaîne confirmée extractible pour 100 % des 38 arrêtés
#    confirmés (pied de page systématique, y compris quand la couverture
#    elle-même est scannée).
#
# Détail de la campagne manuelle, scripts et fichiers intermédiaires :
# dossier `calvados-raa/` (hors dépôt applicatif).
type_connecteur: page_web
url_liste: "https://www.calvados.gouv.fr/Publications/Recueil-des-actes-administratifs"
navigation:
  # Racine → branche "départemental" (motif littéral fixe, ne dépend jamais
  # de la date de collecte — cf. commentaire ci-dessus).
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "-departemental$"
  # Page "départemental" → carte de l'année courante (href se termine par
  # "/2026", sans préfixe).
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "/{annee}$"
selecteur_publications: ".fr-downloads-group li"
# Cible directement l'attribut href (classe cassée sur cette page — cf.
# commentaire ci-dessus).
selecteur_titre: "a[href$='.pdf']"
selecteur_lien_pdf: "a[href$='.pdf']"
autorite_signataire: "Le Préfet du Calvados"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré", "rassemblements festifs"]
patterns_dates:
  # Formulation réelle (Art. 5 des arrêtés confirmés) : "applicables du
  # <jour de la semaine> <JJ> <mois en toutes lettres> <AAAA> à <HH>h<MM>
  # au <jour de la semaine> <JJ> <mois en toutes lettres> <AAAA> à
  # <HH>h<MM>." — jamais un format numérique JJ/MM/AAAA. Restera sans effet
  # tant que cette page (scannée) n'est pas extractible — cf. commentaire
  # en tête de fichier, point 2.
  debut: "applicables?[\\s\\S]{0,60}?du\\s+(?:\\w+\\s+)?(?<date>\\d{1,2}(?:er)?\\s+[a-zéèêûôîàâï]+\\s+\\d{4})"
  fin: "applicables?[\\s\\S]{0,200}?\\bau\\s+(?:\\w+\\s+)?(?<date>\\d{1,2}(?:er)?\\s+[a-zéèêûôîàâï]+\\s+\\d{4})"
# Ancré sur le voisinage de la locution "interdiction des rassemblements
# festifs" (cf. commentaire en tête de fichier, point 1) pour éviter de
# capturer par erreur la référence d'un acte sans rapport, plus tôt dans le
# même bulletin compilé. Capture l'identifiant de publication du RAA
# ("14-AAAA-MM-JJ-NNNNN"), seule référence extractible à 100 % (pied de
# page systématique) — jamais le numéro d'arrêté interne ("N° 2026-25-CAB-
# BSOP"), illisible dès que la page de couverture est scannée (arrêtés
# 2024-2025).
pattern_reference: "(?<reference>14-\\d{4}-\\d{2}-\\d{2}-\\d+)\\s*-\\s*(?:Arr[êe]t[ée]\\s+pr[ée]fectoral|AP)[\\s\\S]{0,80}?interdiction\\s+de[s]?\\s+rassemblements\\s+festifs"

# feature 005 (backfill historique, 2026-09-04) : navigation year-scoped (aucune etape
# ne depend du mois cible), la meme page couvre donc tous les mois d'une meme annee -
# cf. config.schema.ts (granularite_liste) et registre-sources.yaml pour la justification
# structurelle relevee sur ce connecteur.
granularite_liste: annuelle
