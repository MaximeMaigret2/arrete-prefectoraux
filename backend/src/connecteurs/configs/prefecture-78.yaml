# backend/src/connecteurs/configs/prefecture-78.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture des
# Yvelines. VALIDÉE PAR CAPTURE LIVE (navigateur Chrome réel) le
# 2026-08-21 (lot 78-82) — cf. claude/etat-connecteurs.md.
#
# Structure confirmée en live sur
# ".../Publications/Recueil-des-actes-administratifs" : navigation à
# DEUX niveaux — racine → carte de l'année (motif "{annee}$", lien porté
# par ".fr-card__title a") → carte du mois (motif "{mois_fr}$", même
# sélecteur, mois affiché en MAJUSCULES SANS ACCENT dans l'URL — ex.
# "/2026/AOUT" — matché insensible à la casse par le moteur, donc
# "{mois_fr}" ("Aout") suffit sans variante). Page du mois : liste PLATE
# sans pagination, chaque publication dans un `div[class='']` contenant
# un unique `a.fr-link--download` — même famille exacte que
# 37/41/45/49/52/55/59/62/65/66/69/72/73/76 (25/25 liens comptés en live
# pour août 2026, aucune pagination détectée).
#
# Piège écarté sans code spécifique : les liens de mois du menu latéral
# (`.fr-sidemenu`, dupliqués de la carte principale) portent le même
# texte ("AOUT") mais `selecteur_liens: ".fr-card__title a"` ne cible que
# la carte de la zone principale, jamais le sidemenu.
#
# Signataire confirmé (recherche web, 2026-08-21) : M. Brice Blondel,
# préfet des Yvelines (nommé mai/juin 2026, succède à Frédéric Rose) —
# grammaire au masculin.
type_connecteur: page_web
url_liste: "https://www.yvelines.gouv.fr/Publications/Recueil-des-actes-administratifs"
navigation:
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "{annee}$"
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "{mois_fr}$"
selecteur_publications: "div[class='']:has(a.fr-link--download)"
selecteur_titre: "a.fr-link--download"
selecteur_lien_pdf: "a.fr-link--download"
autorite_signataire: "Le préfet des Yvelines"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"
