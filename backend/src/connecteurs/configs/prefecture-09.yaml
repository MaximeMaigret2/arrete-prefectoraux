# backend/src/connecteurs/configs/prefecture-09.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture de l'Ariège.
# Sélecteurs établis le 2026-08-14 (Phase 5bis élargie 2) contre une capture
# réelle du site (fetch direct depuis le sandbox cloud).
#
# Structure réelle, particulière parmi les 5 : `url_liste` RACINE liste
# TROIS collections d'archives successives, non datées de façon exploitable
# par un `pattern_lien` à base de placeholders (ex. "Archives (avant le 1er
# novembre 2012)", "...à partir du 1er novembre 2012", "...à partir du 28
# avril 2015") — la plus récente ("...a-partir-du-28-avril-2015") est la
# collection encore alimentée aujourd'hui (vérifié : contient un mois "Août
# 2026"). Cette 1ère étape de `navigation` utilise donc un `pattern_lien`
# LITTÉRAL fixe plutôt qu'un placeholder de date — légitime ici : ce
# segment d'URL ne varie jamais avec la date de collecte (ce n'est pas une
# année/un mois codé en dur au sens de la règle 8 du contrat, juste un
# palier d'archivage fixe du site).
#
# Cette collection liste ensuite une carte par MOIS (`-{mois_fr}-{annee}`),
# PAGINÉE mais en ordre DÉCROISSANT (le mois courant, "Août 2026", en tête
# de la page 1) — comme prefecture-06/08/10, aucune étape supplémentaire
# vers la "dernière page" n'est nécessaire ici (contrairement à
# prefecture-02/05).
#
# La carte du mois mène à la liste finale, en PLATE, non paginée (7
# bulletins pour août 2026 au moment de la capture) : `<div
# class="fr-downloads-group"><ul><li><a class="fr-link fr-link--download"
# href="...pdf">`. Même piège que prefecture-05/07 : TOUS les liens de
# téléchargement de cette page portent le bug `<a id= class="fr-link
# fr-link--download">` (id vide, casse `class`) — `selecteur_titre`/
# `selecteur_lien_pdf` ciblent donc directement `a[href$='.pdf']`.
#
# Comme les autres connecteurs déployés : le nom du bulletin ("recueil-
# 09-2026-115-recueil-des-actes-administratifs-3") ne mentionne jamais son
# contenu — c'est le moteur `page_web` (scan de contenu PDF) qui retente la
# pertinence sur le texte du PDF avant d'abandonner un candidat.
#
# Formulation exacte du texte réglementaire à l'intérieur d'un vrai PDF NON
# vérifiée (même limite que les connecteurs précédents) —
# `patterns_dates`/`pattern_reference` reprennent l'hypothèse déjà posée
# ailleurs — à confirmer avant collecte réelle.
type_connecteur: page_web
url_liste: "https://www.ariege.gouv.fr/Publications/Recueil-des-actes-administratifs"
navigation:
  # Racine → collection "à partir du 28 avril 2015", toujours alimentée
  # aujourd'hui (motif littéral fixe, ne dépend jamais de la date de
  # collecte — cf. commentaire ci-dessus).
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "a-partir-du-28-avril-2015$"
  # Page de la collection (paginée, ordre décroissant) → carte du mois
  # courant (href se termine par "-mois-Aout-2026", donc par "-Aout-2026").
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "-{mois_fr}-{annee}$"
selecteur_publications: ".fr-downloads-group li"
# Cible directement l'attribut href (classe cassée sur cette page — cf.
# commentaire ci-dessus).
selecteur_titre: "a[href$='.pdf']"
selecteur_lien_pdf: "a[href$='.pdf']"
autorite_signataire: "Le Préfet de l'Ariège"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"
