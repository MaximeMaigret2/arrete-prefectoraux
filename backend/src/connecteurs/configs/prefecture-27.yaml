# backend/src/connecteurs/configs/prefecture-27.yaml
#
# Config déclarative du connecteur page_web pour la Préfecture de l'Eure.
# Sélecteurs établis le 2026-08-14 (Phase 5bis élargie 10, lot 26-30) contre
# une capture réelle du site (fetch direct depuis le sandbox cloud).
#
# Structure réelle (cf. fixtures/connecteurs/reel/prefecture-27/SOURCE.md
# pour le détail complet) :
# - `url_liste` (racine) mélange des cartes DSFR par ANNÉE (`.fr-card__title
#   a`, href se terminant par `RAA-{annee}`) ET des cartes de bulletins
#   spéciaux épinglés individuellement (href du type
#   `Recueil-special-N-27-2026-NNN-du-...-2026`, ne se terminant PAS par
#   `RAA-{annee}`) — motif `RAA-{annee}$` (ancré) plutôt que `-{annee}$`
#   pour ignorer ces cartes épinglées sans ambiguïté (couverture partielle
#   assumée : un bulletin épinglé à la racine mais absent de la page annuelle
#   ne serait pas suivi — non observé au moment de la capture, tous les
#   récents apparaissent aussi dans `RAA-2026`).
# - La page de l'année liste chaque bulletin comme une carte DSFR complète
#   (`div.fr-card`, `a.fr-card__link`), PAGINÉE (`fr-pagination` présent)
#   mais en ordre chronologique DÉCROISSANT (le plus récent en tête, page 1)
#   — aucune étape de pagination nécessaire.
# - Chaque carte pointe vers une page de DÉTAIL HTML (pas de PDF direct) →
#   `page_detail` (comme prefecture-05/02/16), où le vrai lien PDF est
#   présent via `<a class="fr-link fr-link--download" href="...pdf">`, SANS
#   bug de markup `id=` (vérifié sur la page de détail la plus récente).
#   `selecteur_publications: ".fr-card__link"` cible directement l'ancre
#   (comme prefecture-05/77/02) : `page_detail.attribut_lien: href` lit donc
#   directement son propre attribut vers la page de détail.
#
# Signataire réel : « Préfet<br />de l'Eure » (logo textuel DSFR de chaque
# carte, masculin) — aucun vrai PDF de contenu échantillonné avec succès
# (cf. limite ci-dessous).
#
# LIMITE DE CAPTURE : le endpoint `/contenu/telechargement/...` de ce site
# refuse systématiquement les téléchargements automatisés depuis le sandbox
# cloud de cette session (connexion TLS fermée sans réponse, `curl`/`wget`/
# `urllib` — probablement un WAF), alors que les pages HTML (racine, année,
# détail) se récupèrent normalement. Contrairement à la plupart des autres
# connecteurs de ce projet, AUCUN vrai PDF n'a donc pu être échantillonné
# pour ce département — `bulletin-avec-arrete.pdf`/`bulletin-sans-arrete-pertinent.pdf`
# sont entièrement synthétiques (`reportlab`), et la formulation exacte d'un
# vrai arrêté anti rave-party de l'Eure demeure non vérifiée, comme
# `patterns_dates`/`pattern_reference` qui reprennent l'hypothèse générique
# déjà posée pour la plupart des connecteurs précédents.
type_connecteur: page_web
url_liste: "https://www.eure.gouv.fr/Publications/Recueil-des-actes-administratifs-RAA"
navigation:
  - selecteur_liens: ".fr-card__title a"
    pattern_lien: "RAA-{annee}$"
selecteur_publications: ".fr-card__link"
# Sélecteur volontairement sans correspondance (l'élément est une simple
# balise <a>, texte direct, aucun descendant pertinent) : force le repli sur
# $publication.text(), déjà le bon libellé — même idiome que prefecture-05/77/02/16.
selecteur_titre: ".jamais-de-descendant-dans-un-lien-fr-card"
selecteur_lien_pdf: "a.fr-link--download"
page_detail:
  attribut_lien: "href"
autorite_signataire: "Le Préfet de l'Eure"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival", "rassemblement musical non déclaré"]
patterns_dates:
  debut: "à compter du\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au\\s+(?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté\\s+n°\\s*(?<reference>[A-Z0-9-]+)"
