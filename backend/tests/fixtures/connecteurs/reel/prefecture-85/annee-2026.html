<!DOCTYPE html>
<html lang="fr">
<head><title>Recueils des Actes Administratifs 2026 - Recueil des actes administratifs - Publications - Les services de l'État en Vendée</title></head>
<body>
<!--
  Reconstruction fidèle (capture Chrome réelle, 2026-08-21, lot 83-87) : la
  liste des publications de l'année N'EST PAS portée par des cartes DSFR
  mais par un unique <select class="fr-select"> ("Liste"), chaque <option>
  portant l'URL d'une page de détail via `value` (chemin relatif SANS "/"
  de tête, vérifié en live — ex. "Publications/Recueil-des-actes-administratifs/...").
  Le premier <option> ("Liste", value="") est un placeholder à exclure via
  :not([value='']).
-->
<main>
<h1>Recueils des Actes Administratifs 2026</h1>
<form method="post" name="Liste" class="fr-mb-3w">
  <div class="fr-select-group">
    <label class="fr-label" for="Liste-liste-docs">Sélectionnez une option dans la liste ci-dessous</label>
    <select class="fr-select" id="Liste-liste-docs" name="Liste-liste-docs">
      <option value="">Liste</option>
      <option value="Publications/Recueil-des-actes-administratifs/Recueils-des-Actes-Administratifs-2026/Recueil-des-actes-administratifs-2026-169-publie-le-21-08-2026">Recueil des actes administratifs 2026-169 (publié le 21/08/2026).</option>
      <option value="Publications/Recueil-des-actes-administratifs/Recueils-des-Actes-Administratifs-2026/Recueil-des-actes-administratifs-2026-168-publie-le-20-08-2026">Recueil des actes administratifs 2026-168 (publié le 20/08/2026).</option>
    </select>
  </div>
</form>
</main>
</body>
</html>
