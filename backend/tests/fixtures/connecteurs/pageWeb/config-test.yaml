# backend/tests/fixtures/connecteurs/pageWeb/config-test.yaml (T037)
#
# Configuration page_web pour un connecteur de test, utilisée par les tests
# d'intégration (T038) et de contrat (T039) sous
# `tests/fixtures/connecteurs/pageWeb/`. `url_liste` est une URL factice :
# le test qui charge cette configuration doit stubber `fetch` pour lui
# faire renvoyer le contenu de `publication-propre.html` (T036), même
# convention que `tests/unit/connecteurs/moteurPageWeb.test.ts` — aucun
# accès réseau sortant n'est effectué dans les tests.
url_liste: "https://exemple-test.gouv.fr/Publications/RAA"
selecteur_publications: ".raa-item"
selecteur_titre: ".raa-item__titre"
selecteur_lien_pdf: ".raa-item__piece-jointe"
autorite_signataire: "Le Préfet de test"
type_evenement_par_defaut: interdiction
mots_cles_filtrage: ["rave", "teknival"]
patterns_dates:
  debut: "à compter du (?<date>\\d{2}/\\d{2}/\\d{4})"
  fin: "jusqu'au (?<date>\\d{2}/\\d{2}/\\d{4})"
pattern_reference: "Arrêté n°\\s*(?<reference>[0-9-]+)"
